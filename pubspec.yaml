name: zarfla
description: "Zarfla — Demir Games Studio dijital davetiye uygulaması."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  webview_flutter: ^4.9.0
  # Editörde müzik önizlemesi: gizli WebView'de <audio> (yeni ses paketi yok). Android'e özgü
  # setMediaPlaybackRequiresUserGesture için doğrudan bağımlılık (webview_flutter zaten bunu getiriyor).
  webview_flutter_android: ">=3.16.0"
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10
  # Firebase (Aşama 2). Üst sınır bilerek açık: derleme makinesi pub.dev'e erişemediği için sürümler
  # CI'da çözülür ve birbiriyle uyumlu en yeni set seçilir. Android BoM'u eklentiler kendisi getirir.
  firebase_core: ">=4.0.0"
  firebase_auth: ">=6.0.0"
  cloud_firestore: ">=6.0.0"
  firebase_storage: ">=13.0.0"
  # Reklam (Aşama 3): AdMob banner + Google UMP rıza formu. Sürüm CI'da çözülür (Firebase ile aynı gerekçe).
  google_mobile_ads: ">=6.0.0"
  # Aşama 3: redeemPurchase çağrısı (europe-west3) ve Google Play Faturalandırma (resmî eklenti, yalnız Android).
  # in_app_purchase_android doğrudan kullanılır (tüketme: consumePurchase, sahip olunan alımlar: queryPastPurchases).
  cloud_functions: ">=6.0.0"
  # Güvenlik denetimi M-4 / Play Billing: faturalandırma eklentileri caret ile sabit. in_app_purchase_android 0.5.5 =
  # Play Billing Library 9.1.0 (0.5.0+ = PBL 8; Google 31 Ağustos 2026'dan beri PBL 8+ şart). 0.4.x (PBL 7) ya da
  # kırıcı 0.6 kendiliğinden gelmez; yükseltme bilinçli yapılır. Çözülen sürüm ve PBL sürümü CI günlüğüne yazılır.
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.5
  # Yerel hatırlatma bildirimleri (sunucu/FCM yok). API: 20+ adlandırılmış parametreli (initialize/zonedSchedule/cancel).
  # 23+ Flutter 3.44 / AGP 9.1 / compileSdk 37 (androidx.core 1.19) ister; uygulama compileSdk'ı Flutter varsayılanında
  # (36) kalsın diye üst sınır 23'ün altında. CI'da bu şart yüzünden Debug APK düştü (17 Kasım 2026, 23.x çözülmüştü).
  # Zaman, UTC bölgesinde mutlak an olarak verilir (tekrarlı bildirim yok); yerel saat dilimi veritabanı gerekmez.
  flutter_local_notifications: ">=21.0.0 <23.0.0"
  timezone: ">=0.10.0"
  # Uygulama içi değerlendirme (Google Play sistem penceresi).
  in_app_review: ">=2.0.9"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/ornaments/
    - assets/invite/
    - assets/fonts/licenses/
  # Yazı tipleri uygulamaya paketlenir (çalışma anında indirme yok).
  # Dosyalar CI'da scripts/fetch_fonts.sh ile github.com/google/fonts'tan indirilir.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
