<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zarfla</title>
<!--
  Zarfla davetli sayfası — TEK KAYNAK.
  Aynı dosya hem uygulama içi önizlemede (webview_flutter, assets/invite/invite.html)
  hem de Aşama 2'de Demir Games Studio sitesinde (davetli bağlantısı) kullanılır.
  Veri iki yolla gelir:
    1) window.renderInvite(veri)  — uygulama JSON nesnesini/dizesini doğrudan verir.
    2) ?id=XXXX (veya #id=XXXX)   — window.ZARFLA_DATA_URL ayarlıysa ("…/{id}.json"
       biçiminde), sayfa veriyi kendisi çeker (Aşama 2: Firebase/Firestore uç noktası).
  Reklam veya izleme kodu YOKTUR; eklemeyin.
  Kaynak: onaylı web önizlemesi (mountInvite, CSS, SVG semboller) birebir aktarıldı.
-->
<style>
@font-face{font-family:"Noto Naskh Arabic";font-display:swap;src:local("Noto Naskh Arabic"),url("../fonts/NotoNaskhArabic.ttf") format("truetype")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;background:#E4DBCB;color:var(--a-ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#root{position:fixed;inset:0}
.zf-msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:15px/1.5 system-ui,sans-serif;color:#5A5F58;background:#F7F1E8}
/* ===== DAVETİYE (davetlinin göreceği sayfa) ===== */
.inv-host{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.inv-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.inv{color:var(--ink);font-family:Georgia,"Times New Roman","Noto Naskh Arabic","Amiri",serif;max-width:560px;margin:0 auto;padding:0 18px 50px;opacity:0;transform:translateY(16px);transition:opacity 1.2s ease .8s,transform 1.2s ease .8s}
.inv-host.revealed .inv{opacity:1;transform:none}
.inv .hero{text-align:center;padding:56px 6px 22px}
.inv .wreath{width:250px;max-width:78%;margin:0 auto 4px;display:block}
.inv .eyebrow{font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:12px}
[dir=rtl] .inv .eyebrow,[dir=rtl] .inv .label{letter-spacing:0}
.inv .names{font-style:italic;font-weight:400;font-size:clamp(44px,13vw,70px);line-height:1.08;color:var(--accent)}
[dir=rtl] .inv .names{font-style:normal}
.inv .names .amp{display:block;font-size:.5em;color:var(--gold);margin:4px 0}
.inv .host{font-size:17px;color:var(--muted);margin-top:12px}
.inv .lead{font-size:20px;font-style:italic;color:var(--muted);margin-top:16px;line-height:1.55;white-space:pre-line}
[dir=rtl] .inv .lead{font-style:normal}
.inv .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px 0}
.inv .divider::before,.inv .divider::after{content:"";height:1px;width:70px;background:var(--line)}
.inv .divider svg{width:28px;height:28px}
.inv .icard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 22px;margin:18px 0;text-align:center;box-shadow:0 12px 30px -18px rgba(0,0,0,.35);position:relative;overflow:hidden}
.inv .icard .mini{position:absolute;width:64px;opacity:.9}
.inv .icard .mini.tl{top:-14px;inset-inline-start:-14px}
.inv .icard .mini.br{bottom:-14px;inset-inline-end:-14px}
.inv .label{font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;letter-spacing:.26em;text-transform:uppercase;font-size:11.5px;color:var(--accent);margin-bottom:10px;font-weight:600}
.inv .big{font-size:28px;font-weight:600;line-height:1.25}
.inv .sub{font-size:18px;color:var(--muted);margin-top:6px;line-height:1.45;white-space:pre-line}
.inv .daterow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.inv .daterow .side{font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 4px;min-width:86px}
.inv .daterow .day{font-size:56px;font-weight:600;color:var(--accent);line-height:1}
.inv .countdown{display:flex;justify-content:center;gap:8px;margin-top:20px}
.inv .countdown div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 0;width:64px}
.inv .countdown b{display:block;font-size:24px;font-weight:600;color:var(--accent)}
.inv .countdown small{font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.inv .ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:14px;font-weight:600;padding:13px 20px;border-radius:40px;border:none;cursor:pointer;text-decoration:none;min-height:46px}
.inv .ibtn-primary{background:var(--accent);color:var(--onAccent)}
.inv .ibtn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.inv .ibtn svg{width:18px;height:18px}
.inv .brow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.inv form{text-align:start;margin-top:14px}
.inv .ifield{margin-bottom:14px}
.inv .ifield label{display:block;font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inv .ifield input,.inv .ifield select,.inv .ifield textarea{width:100%;font-family:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;min-height:48px}
.inv .ifield textarea{min-height:70px;resize:vertical}
.inv .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv .choice input,.inv .ifield .choice input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0;padding:0}
.inv .choice label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:17px;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;cursor:pointer;background:var(--bg);text-align:center;margin:0}
.inv .choice label svg{width:28px;height:28px}
.inv .choice input:checked+label{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inv .ierr{color:var(--err);font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;margin:-6px 0 10px;display:none}
.inv .thanks{display:none;text-align:center;padding:8px 0}
.inv .thanks h3{font-style:italic;font-weight:400;font-size:40px;color:var(--accent)}
.inv .thanks p{font-size:18px;color:var(--muted);margin:8px 0 4px;line-height:1.5}
.inv footer{text-align:center;margin-top:36px}
.inv footer>svg{width:42px;height:42px;display:block;margin:0 auto 6px}
.lay-editoryal footer>svg{margin-inline-start:0}
.inv footer .sign{font-style:italic;font-size:32px;color:var(--accent)}
.inv footer p{font-size:16px;color:var(--muted);font-style:italic}
.inv .replay{margin-top:16px;background:none;border:none;font-family:"Segoe UI",system-ui,sans-serif;font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline}
.inv .madeby{margin-top:26px;font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:11.5px;color:var(--muted);opacity:.85}
.inv .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.inv .reveal.in{opacity:1;transform:none}
/* Kapı */
.gate{position:absolute;inset:0;z-index:50;perspective:1800px;display:flex;direction:ltr}
.gate.gone{pointer-events:none;visibility:hidden}
.door{position:relative;width:50%;height:100%;background:linear-gradient(180deg,var(--door1),var(--door2));transition:transform 2.2s cubic-bezier(.65,.02,.22,1),filter 2.2s ease;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
.door.l{transform-origin:left center;border-right:1px solid var(--doorLine)}
.door.r{transform-origin:right center;border-left:1px solid var(--doorLine)}
.gate.open .door.l{transform:rotateY(-108deg);filter:brightness(.7)}
.gate.open .door.r{transform:rotateY(108deg);filter:brightness(.7)}
.panel{position:absolute;left:12%;right:12%;border:2px solid var(--doorLine);border-radius:120px 120px 10px 10px}
.panel.t{top:7%;height:46%}.panel.b{bottom:7%;height:32%;border-radius:10px}
.panel::after{content:"";position:absolute;inset:10px;border:1px solid var(--doorLine);opacity:.6;border-radius:inherit}
.door svg.corner{position:absolute;width:46%}
.door.l svg.corner{top:-3%;left:-8%}
.door.r svg.corner{bottom:-3%;right:-8%;transform:rotate(180deg)}
.handle{position:absolute;top:50%;width:12px;height:70px;border-radius:8px;background:linear-gradient(180deg,#f7e2a1,#d6ad4c 50%,#b88a2c);transform:translateY(-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.door.l .handle{right:16px}.door.r .handle{left:16px}
/* Zarf */
.env{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s ease 1.5s;direction:ltr}
.env.open{opacity:0}
.env.gone{pointer-events:none;visibility:hidden}
.env .box{position:relative;width:300px;max-width:82%;aspect-ratio:3/2;perspective:900px;transition:transform 1s ease .9s}
.env.open .box{transform:translateY(40%) scale(.9)}
.env .back{position:absolute;inset:0;background:var(--door2);border-radius:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)}
.env .letter{position:absolute;left:7%;right:7%;top:10%;bottom:8%;background:var(--paper);border-radius:6px;transition:transform 1s ease .6s;display:grid;place-items:center}
.env .letter svg{width:46px;height:46px}
.env.open .letter{transform:translateY(-55%)}
.env .front{position:absolute;inset:0;background:linear-gradient(160deg,var(--door1),var(--door2));clip-path:polygon(0 30%,50% 65%,100% 30%,100% 100%,0 100%);border-radius:8px}
.env .flap{position:absolute;left:0;right:0;top:0;height:66%;background:var(--door1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .9s ease;z-index:3;filter:brightness(1.06)}
.env.open .flap{transform:rotateX(180deg);z-index:0}
/* Mühür */
.seal{position:absolute;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .6s ease,transform .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.85);pointer-events:none}
.seal-disc{width:140px;height:140px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.35),inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line);position:relative;animation:breathe 3s ease-in-out infinite}
.seal-disc svg{position:absolute;inset:-20px;width:180px;height:180px;animation:spin 40s linear infinite}
.seal-disc span{font-family:Georgia,"Times New Roman","Noto Naskh Arabic",serif;font-style:italic;font-size:36px;color:var(--accent);position:relative;line-height:1;white-space:nowrap}
.seal-disc svg.ini-orn{position:static;inset:auto;width:52px;height:52px;animation:none;color:var(--accent)}
.mono-ini svg.ini-orn{width:84px;height:84px;color:var(--accent)}
.seal-hint{font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-weight:600;letter-spacing:.14em;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:9px 18px;border-radius:30px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}
.petals{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.petals svg{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
/* ===== Sayfa düzenleri ===== */
.inv .countdown div{flex:1 1 0;min-width:0;max-width:64px;width:auto}
.inv .countdown div,.inv .countdown b,.inv .countdown small{text-align:center!important}
.inv .countdown small{display:block}
.inv .daterow .side{min-width:0;flex:0 1 92px}
.inv img{display:block;max-width:100%}
.inv .hero.has-cv{padding-top:40px}.inv .has-cv .wreath{width:170px;margin-bottom:-4px}
.inv .cv-frame{width:230px;max-width:72%;margin:6px auto 18px;padding:7px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 30px -18px rgba(0,0,0,.45)}
.inv .cv-frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px}
.inv .prog{list-style:none;text-align:start;max-width:340px;margin:12px auto 0}
.inv .prog li{display:flex;gap:14px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.35}
.inv .prog li:last-child{border-bottom:none}
.inv .prog b{color:var(--accent);flex:0 0 56px;font-variant-numeric:tabular-nums;font-weight:600;direction:ltr;text-align:start}
.inv .gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin-top:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.inv .gal-it{flex:0 0 72%;aspect-ratio:4/5;border:none;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;scroll-snap-align:center;background:var(--bg);box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
.inv .gal-it:only-child{flex-basis:100%}
.inv .gal-it img{width:100%;height:100%;object-fit:cover}
.lb{position:absolute;inset:0;z-index:80;background:rgba(8,8,10,.94);display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb button svg{width:22px;height:22px}
.lb .lb-x{top:14px;inset-inline-end:14px}
.lb .lb-p{inset-inline-start:10px;top:50%;margin-top:-24px}
.lb .lb-n{inset-inline-end:10px;top:50%;margin-top:-24px}
.lb .lb-n svg{transform:rotate(180deg)}
.inv-host[dir=rtl] .lb .lb-n svg{transform:none}
.inv-host[dir=rtl] .lb .lb-p svg{transform:rotate(180deg)}
.lb .lb-c{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;direction:ltr}
/* Kemer */
.hero-kemer{padding-top:40px!important}
.arch{width:280px;max-width:88%;margin:0 auto 6px;background:var(--paper);border:2px solid var(--gold);border-radius:150px 150px 18px 18px;padding:8px;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.arch-in{border:1px solid var(--line);border-radius:142px 142px 12px 12px;overflow:hidden;padding-bottom:20px}
.arch-img{width:100%;aspect-ratio:1/1.05;object-fit:cover}
.arch-orn{padding:38px 0 6px}.arch-orn svg{width:96px;height:96px;margin:0 auto;display:block}
.arch-txt{padding:16px 14px 0}
.arch .names{font-size:clamp(36px,10.5vw,52px)}
.lay-kemer .icard{border-radius:120px 120px 22px 22px;padding-top:40px}
.lay-kemer .icard .mini{display:none}
/* Monogram */
.hero-mono{padding-top:44px!important}
.mono{position:relative;width:230px;height:230px;margin:6px auto 18px;display:grid;place-items:center}
.mono-ring{position:absolute;inset:0;width:100%;height:100%}
.mono-img{width:152px;height:152px;border-radius:50%;object-fit:cover;position:relative;box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--line)}
.mono-ini{position:relative;font-style:italic;font-size:54px;color:var(--accent);line-height:1;white-space:nowrap}
[dir=rtl] .mono-ini{font-style:normal}
.inv .mono-names{font-size:clamp(26px,7.4vw,34px);font-style:normal;letter-spacing:.06em;color:var(--ink)}
[dir=rtl] .inv .mono-names{letter-spacing:0}
.inv .mono-names .amp{display:inline;font-size:.8em;margin:0 .2em;font-style:italic;color:var(--gold)}
.lay-monogram .icard{box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line),0 12px 30px -18px rgba(0,0,0,.35)}
/* Editoryal */
.lay-editoryal{counter-reset:sec}
.ed{text-align:start!important;padding:46px 0 10px!important}
.ed-top{display:flex;gap:16px;align-items:stretch}
.ed-vert{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);border-inline-start:1px solid var(--line);padding-inline-start:8px;flex:none;white-space:nowrap}
[dir=rtl] .ed-vert{transform:none;letter-spacing:0;font-size:13px}
.ed-main{flex:1;min-width:0}
.ed-cover{width:84%;aspect-ratio:4/5;object-fit:cover;box-shadow:12px 12px 0 -1px var(--bg),12px 12px 0 0 var(--accent);margin-bottom:26px}
[dir=rtl] .ed-cover{box-shadow:-12px 12px 0 -1px var(--bg),-12px 12px 0 0 var(--accent)}
.ed-orn{width:84px;height:84px;margin-bottom:10px;display:block}
.ed-rule{height:1px;background:var(--accent);opacity:.7;margin:14px 0}
.inv .ed-names{font-style:normal;font-weight:400;font-size:clamp(46px,14vw,78px);line-height:.98;color:var(--ink);text-align:start;overflow-wrap:anywhere}
.inv .ed-names .amp{display:block;font-style:italic;font-size:.42em;color:var(--accent);margin:6px 0}
.ed .host,.ed .lead{text-align:start}
.lay-editoryal .icard{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;box-shadow:none;text-align:start;padding:24px 0 18px;margin:8px 0;overflow:visible}
.lay-editoryal .icard .mini{display:none}
.lay-editoryal .icard>.label{counter-increment:sec}
.lay-editoryal .icard>.label::before{content:counter(sec,decimal-leading-zero) "  ·  ";color:var(--muted)}
.lay-editoryal .brow,.lay-editoryal .daterow,.lay-editoryal .countdown{justify-content:flex-start}
.lay-editoryal .prog{margin-inline-start:0}
.lay-editoryal footer{text-align:start;border-top:1px solid var(--line);padding-top:22px}
/* Kartpostal */
.inv-host.L-kartpostal{background-color:var(--door2);background-image:radial-gradient(var(--doorLine) 1px,transparent 1.6px),linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.12));background-size:18px 18px,100% 100%}
.lay-kartpostal{padding:34px 16px 60px}
.pc{background:var(--paper);border-radius:6px;padding:14px 16px 26px;transform:rotate(-1.1deg);box-shadow:0 34px 50px -24px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.2)}
[dir=rtl] .pc{transform:rotate(1.1deg)}
.pc-top{position:relative;margin-bottom:6px}
.pc-photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px}
.pc-art{height:170px;border-radius:3px;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
.pc-art svg{width:110px;height:110px}
.pc-stamp{position:absolute;top:10px;inset-inline-end:10px;width:62px;height:74px;background:var(--paper);padding:5px;border:2px dashed var(--line);box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(4deg)}
.pc-stamp div{width:100%;height:100%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.pc-stamp svg{width:38px;height:38px}
.pc-mark{position:absolute;bottom:-22px;inset-inline-start:12px;width:84px;height:84px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;text-align:center;font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;font-size:11px;font-weight:700;line-height:1.25;color:var(--muted);background:var(--paper);transform:rotate(-12deg);padding:6px}
.lay-kartpostal .hero{padding:36px 4px 14px}
.pc-sheet{background:var(--paper);border-radius:6px;margin-top:30px;padding:6px 16px 26px;box-shadow:0 24px 40px -22px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.16);position:relative;overflow:hidden}
.pc-sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,var(--paper) 12px 18px,var(--gold) 18px 30px,var(--paper) 30px 36px)}
.pc-sheet>.icard:first-child{border-top:none;padding-top:30px}
.lay-kartpostal .icard{background:transparent;border:none;border-top:1.5px dashed var(--line);border-radius:0;box-shadow:none;margin:0;padding:24px 4px}
.lay-kartpostal .icard .mini{display:none}
.lay-kartpostal footer{border-top:1.5px dashed var(--line);padding-top:24px;margin-top:0}
/* Zaman çizelgesi */
.tl-cover{width:100%;margin:0 auto 20px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.tl-cover img{width:100%;aspect-ratio:16/11;object-fit:cover}
.tl{position:relative;padding-inline-start:30px;margin-top:8px}
.tl::before{content:"";position:absolute;inset-inline-start:9px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--accent),var(--line));border-radius:2px}
.tl-it{position:relative}
.tl-dot{position:absolute;inset-inline-start:-28px;top:34px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent);z-index:1}
.lay-zamancizelgesi .icard{text-align:start;padding:24px 18px}
.lay-zamancizelgesi .icard .mini{display:none}
.lay-zamancizelgesi .brow,.lay-zamancizelgesi .daterow,.lay-zamancizelgesi .countdown{justify-content:flex-start}
.tl-step{display:flex;gap:14px;align-items:baseline;padding:12px 4px}
.tl-step .tl-dot{top:16px;width:12px;height:12px;inset-inline-start:-25px;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--accent)}
.tl-step b{flex:0 0 58px;color:var(--accent);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.tl-step span{font-size:19px;line-height:1.35}
.tl-head{padding:16px 4px 2px}
.tl-head .tl-dot{display:none}
.tl-head .label{margin:0}
/* Bilet */
.tk{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;max-width:360px;margin:0 auto;box-shadow:0 18px 40px -24px rgba(0,0,0,.55)}
.tk-cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:17px 17px 0 0}
.tk-band{height:64px;border-radius:17px 17px 0 0;background:repeating-linear-gradient(135deg,var(--door1) 0 12px,var(--door2) 12px 24px);display:grid;place-items:center}
.tk-band svg{width:52px;height:52px;background:var(--paper);border-radius:50%;padding:6px}
.tk-main{padding:20px 18px 18px}
.tk .names{font-size:clamp(38px,11vw,56px)}
.tk-perf{position:relative;height:26px}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk-perf::before{left:-14px}.tk-perf::after{right:-14px}
.tk-perf i{position:absolute;left:20px;right:20px;top:12px;border-top:2px dashed var(--line)}
.tk-stub{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;padding:8px 14px 18px;font-family:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;text-align:center}
.tk-stub small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
[dir=rtl] .tk-stub small{letter-spacing:0;font-size:12px}
.tk-stub b{font-size:15px;color:var(--ink);font-weight:700}
.tk-stub div+div{border-inline-start:1px dashed var(--line)}
.lay-bilet .icard{border-style:dashed;border-width:1.5px}
/* ===== Açılışlar ===== */
.perde{position:absolute;inset:0;z-index:50;overflow:hidden;transition:opacity .7s ease 1.4s}
.perde.open{opacity:0}.perde.gone{visibility:hidden;pointer-events:none}
.perde .cur{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,var(--door1) 0,var(--door2) 13px,var(--door1) 26px);transition:transform 1.6s cubic-bezier(.6,.02,.25,1);box-shadow:inset 0 -90px 90px -50px rgba(0,0,0,.35)}
.perde .cur.l{left:0;transform-origin:left top}.perde .cur.r{right:0;transform-origin:right top}
.perde.open .cur{transform:scaleX(.09)}
.perde .val{position:absolute;left:0;right:0;top:0;height:44px;background:var(--door2);border-bottom:2px solid var(--doorLine);box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:2}
.book{position:absolute;inset:0;z-index:50;perspective:2200px;transition:opacity .6s ease 1.6s}
.book.open{opacity:0}.book.gone{visibility:hidden;pointer-events:none}
.book .page{position:absolute;inset:0;background:var(--paper);background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px)}
.book .bcover{position:absolute;inset:0;background:linear-gradient(135deg,var(--door1),var(--door2));transform-origin:left center;transition:transform 1.6s cubic-bezier(.6,.02,.25,1),filter 1.6s ease;transform-style:preserve-3d}
.book .bcover::before{content:"";position:absolute;top:0;bottom:0;left:0;width:16px;background:rgba(0,0,0,.2)}
.inv-host[dir=rtl] .book .bcover{transform-origin:right center}
.inv-host[dir=rtl] .book .bcover::before{left:auto;right:0}
.book.open .bcover{transform:rotateY(-160deg);filter:brightness(.6)}
.inv-host[dir=rtl] .book.open .bcover{transform:rotateY(160deg)}
.book .bframe{position:absolute;inset:26px 22px 26px 34px;border:2px solid var(--doorLine);border-radius:10px}
.inv-host[dir=rtl] .book .bframe{inset:26px 34px 26px 22px}
.book .bframe::after{content:"";position:absolute;inset:8px;border:1px solid var(--doorLine);border-radius:6px;opacity:.7}
.book .bframe svg{position:absolute;width:54px;height:54px;left:50%;margin-left:-27px;opacity:.9}
.book .bframe svg.t{top:22px}.book .bframe svg.b{bottom:22px}
.sealcover{position:absolute;inset:0;z-index:50;background:var(--bg);transition:opacity .8s ease .9s}
.sealcover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.3px,transparent 1.8px);background-size:22px 22px}
.sealcover i{position:absolute;inset:18px;border:1px solid var(--line);border-radius:16px}
.sealcover.open{opacity:0}.sealcover.gone{visibility:hidden;pointer-events:none}
.seal-wrap{position:relative;width:140px;height:140px}
.seal-wrap .half{position:absolute;inset:0;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .6s ease .55s}
.seal-wrap .half.l{clip-path:inset(-40px 50% -40px -40px)}
.seal-wrap .half.r{clip-path:inset(-40px -40px -40px 50%)}
.seal-wrap::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:1px;background:var(--line);transition:opacity .2s}
.seal-hint{transition:opacity .3s ease}
.opened .seal.split{opacity:1;transform:translate(-50%,-50%);transition:none}
.opened .seal.split .seal-hint,.opened .seal-wrap::after{opacity:0}
.opened .seal-wrap .half.l{transform:translateX(-120px) rotate(-22deg);opacity:0}
.opened .seal-wrap .half.r{transform:translateX(120px) rotate(22deg);opacity:0}
.light{position:absolute;inset:0;z-index:50;overflow:hidden;transition:opacity .8s ease 1.3s}
.light.open{opacity:0}.light.gone{visibility:hidden;pointer-events:none}
.light .spot{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;box-shadow:0 0 0 220vmax rgba(6,7,14,.96),inset 0 0 50px 8px var(--gold);transition:transform 1.8s cubic-bezier(.6,0,.3,1)}
.light .spot::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--gold);opacity:.6;animation:halo 2.4s ease-in-out infinite}
.light.open .spot{transform:scale(10)}
@keyframes halo{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.08);opacity:.25}}
@media (prefers-reduced-motion:reduce){
  .op,.op *{transition:opacity .45s ease!important;animation:none!important}
  .op.open *{transform:none!important}
  .op.open{opacity:0}
  .seal-disc,.seal-disc svg{animation:none}.petals{display:none}
  .seal-wrap .half{transition:opacity .3s ease!important}
  .opened .seal-wrap .half{transform:none!important}
  .inv{transition:opacity .5s ease!important;transform:none!important}
}
</style>
</head>

const PH={"tr":{"ph1":"İsim","ph2":"İsim","phOne":"İsim"},"en":{"ph1":"Name","ph2":"Name","phOne":"Name"},"de":{"ph1":"Name","ph2":"Name","phOne":"Name"},"ar":{"ph1":"الاسم","ph2":"الاسم","phOne":"الاسم"}};
const LAYOUTS=["klasik","kemer","monogram","editoryal","kartpostal","zamancizelgesi","bilet"];
const OPENINGS=["door","env","perde","kitap","muhur","isik"];
const OPEN_MS={door:2300,env:2300,perde:2100,kitap:2200,muhur:1600,isik:2100};
let tickTimer=null,io=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shiftDate(s,days){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d+days)).toISOString().slice(0,10)}
function fmtISO(s,lang){if(!s)return"";const [y,m,d]=s.split("-").map(Number);return new Intl.DateTimeFormat(LOCALE[lang],{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,d,12)))}
function parts(inv){
  if(!inv.date) return null;
  const [y,m,d]=inv.date.split("-").map(Number);
  const [hh,mm]=(inv.time||"00:00").split(":").map(Number);
  return {y,m,d,hh,mm,local:new Date(y,m-1,d,hh,mm),noon:new Date(Date.UTC(y,m-1,d,12))};
}
function normInv(i){
  const str=k=>{if(typeof i[k]!=="string")i[k]=i[k]==null?"":String(i[k])};
  ["id","type","theme","lang","n1","n2","host","msg","date","time","end","venue","address","wa","opening","layout","cover","status"].forEach(str);
  if(!i.id)i.id="zarfla";
  if(!THEMES[i.theme])i.theme="papatya";
  if(!G[i.lang])i.lang="tr";
  if(!EYEBROW.tr[i.type])i.type="diger";
  if(!LAYOUTS.includes(i.layout))i.layout="klasik";
  if(!OPENINGS.includes(i.opening))i.opening="door";
  if(!Array.isArray(i.photos))i.photos=[];
  i.photos=i.photos.filter(x=>typeof x==="string"&&x);
  if(!Array.isArray(i.program))i.program=[];
  i.program=i.program.filter(Boolean).map(s=>({t:String(s.t||""),x:String(s.x||"")}));
  return i;
}

/* ===== Davetli sayfası (önizlemedeki mountInvite, değiştirilmeden) ===== */
function mountInvite(host,inv,isGuest){
  normInv(inv);
  const th=THEMES[inv.theme],L=G[inv.lang],v=th.v,o=th.orn,lay=inv.layout,opn=inv.opening;
  const couple=COUPLE[inv.type];
  const r1=inv.n1.trim()||(couple?PH[inv.lang].ph1:PH[inv.lang].phOne);
  const r2=inv.n2.trim()||PH[inv.lang].ph2;
  const n1=esc(r1),n2=esc(r2);
  const noName=couple?(!inv.n1.trim()||!inv.n2.trim()):!inv.n1.trim();
  const ini=noName?`<svg class="ini-orn" viewBox="0 0 100 100" aria-hidden="true"><use href="#${o}"/></svg>`:esc(couple?(r1.charAt(0)+" & "+r2.charAt(0)):r1.charAt(0));
  const p=parts(inv);
  const showMade=inv.plan!=="premium";
  const photos=inv.photos.filter(Boolean),cover=inv.cover||"";
  const prog=inv.program.filter(st=>st&&st.x&&st.x.trim());
  const orn=(cls="")=>`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><use href="#${o}"/></svg>`;
  const namesH=couple?`${n1}<span class="amp">&amp;</span>${n2}`:n1;
  const eyebrow=`<p class="eyebrow">${EYEBROW[inv.lang][inv.type]}</p>`;
  const hostH=inv.host.trim()?`<p class="host">${esc(inv.host)}</p>`:"";
  const leadH=`<p class="lead" dir="auto">${esc(inv.msg)}</p>`;
  const wreath=`<svg class="wreath" viewBox="0 0 300 110" aria-hidden="true" style="color:${v.leaf}">
        <path d="M20 96 C 80 58, 220 58, 280 96" stroke="${v.leaf}" stroke-width="2" fill="none"/>
        <use href="#leaf" x="50" y="72" width="34" height="14" transform="rotate(-25 67 79)"/><use href="#leaf" x="216" y="72" width="34" height="14" transform="rotate(205 233 79)"/>
        <use href="#${o}" x="118" y="6" width="64" height="64"/><use href="#${o}" x="80" y="36" width="38" height="38"/><use href="#${o}" x="182" y="36" width="38" height="38"/>
      </svg>`;
  const divider=`<div class="divider">${orn()}</div>`;
  let dateHtml=`<p class="sub">${L.soon}</p>`,dShort="—";
  if(p){
    const f=new Intl.DateTimeFormat(LOCALE[inv.lang],{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).formatToParts(p.noon);
    const g=k=>(f.find(x=>x.type===k)||{}).value||"";
    const tm=inv.time+(inv.end?" – "+inv.end:"");
    dShort=fmtISO(inv.date,inv.lang);
    dateHtml=`<div class="daterow"><div class="side">${g("weekday")}</div><div class="day">${g("day")}</div><div class="side">${g("month")}</div></div>
      <p class="sub">${g("year")} · ${L.timeW} ${esc(tm)}</p>
      <div class="countdown">${L.units.map((u,i)=>`<div><b data-cd="${i}">0</b><small>${u}</small></div>`).join("")}</div>`;
  }
  const q=encodeURIComponent([inv.venue,inv.address].filter(Boolean).join(", "));
  /* Ortak kartlar */
  const whenC=`<section class="icard reveal">${orn("mini tl")}<p class="label">${L.when}</p>${dateHtml}
      ${p?`<div class="brow"><a class="ibtn ibtn-ghost" data-ics><svg><use href="#i-cal"/></svg>${L.cal}</a></div>`:""}</section>`;
  const whereC=`<section class="icard reveal">${orn("mini br")}<p class="label">${L.where}</p>
      <p class="big">${esc(inv.venue||"—")}</p>${inv.address?`<p class="sub">${esc(inv.address)}</p>`:""}
      ${q?`<div class="brow"><a class="ibtn ibtn-primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}"><svg><use href="#i-pin"/></svg>${L.dir}</a><a class="ibtn ibtn-ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">${L.map}</a></div>`:""}</section>`;
  const progC=prog.length?`<section class="icard reveal"><p class="label">${L.program}</p><ol class="prog">${prog.map(st=>`<li><b>${esc(st.t||"")}</b><span dir="auto">${esc(st.x)}</span></li>`).join("")}</ol></section>`:"";
  const galC=photos.length?`<section class="icard reveal"><p class="label">${L.gallery}</p><div class="gal">${photos.map((d,i)=>`<button class="gal-it" type="button" data-gi="${i}" aria-label="${L.enlarge} ${i+1}/${photos.length}"><img src="${d}" alt="" loading="lazy"></button>`).join("")}</div></section>`:"";
  const rsvpC=`<section class="icard reveal"><p class="label">${L.rsvpT}</p><p class="big" style="font-size:25px">${L.rsvpQ}</p><p class="sub">${L.rsvpNote}</p>
      <form novalidate data-rsvp>
        <div class="ifield"><label for="rn${inv.id}">${L.name}</label><input id="rn${inv.id}" data-r="name" autocomplete="name" placeholder="${L.namePh}" maxlength="60"></div><div class="ierr" data-e="name">${L.errName}</div>
        <div class="ifield"><div class="choice">
          <input type="radio" name="att${inv.id}" id="y${inv.id}" value="yes"><label for="y${inv.id}">${orn()}${L.yes}</label>
          <input type="radio" name="att${inv.id}" id="n${inv.id}" value="no"><label for="n${inv.id}"><svg style="color:${v.muted}"><use href="#i-sad"/></svg>${L.no}</label></div></div>
        <div class="ierr" data-e="att">${L.errAtt}</div>
        <div class="ifield" data-countwrap><label for="rc${inv.id}">${L.count}</label><select id="rc${inv.id}" data-r="count">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} ${L.person}</option>`).join("")}</select></div>
        <div class="ifield"><label for="rm${inv.id}">${L.msg}</label><textarea id="rm${inv.id}" data-r="msg" placeholder="${L.msgPh}" maxlength="300"></textarea></div>
        <button class="ibtn ibtn-primary" type="submit" style="width:100%"><svg><use href="#i-wa"/></svg>${L.send}</button>
      </form>
      <div class="thanks" data-thanks><h3 data-tt></h3><p data-tx></p><div class="brow"><a class="ibtn ibtn-primary" data-wa target="_blank" rel="noopener">${L.waSend}</a><button class="ibtn ibtn-ghost" type="button" data-editr>${L.edit}</button></div><p style="font-size:14px;margin-top:12px">${L.waRetry}</p></div>
    </section>`;
  const footer=`<footer class="reveal">${orn()}<p>${L.love}</p>
      <div class="sign">${couple?`${n1} &amp; ${n2}`:n1}</div>
      <button class="replay" type="button" data-replay>${L.replay}</button>
      ${showMade?`<div class="madeby">${L.made}</div>`:""}</footer>`;
  const ring=(n,R,c,sz)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return `<use href="#${o}" x="${(c+Math.cos(a)*R-sz/2).toFixed(1)}" y="${(c+Math.sin(a)*R-sz/2).toFixed(1)}" width="${sz}" height="${sz}"/>`}).join("");
  /* Düzene göre sayfa */
  let page="";
  if(lay==="kemer"){

    page=`<section class="hero hero-mono">${eyebrow}<div class="mono"><svg class="mono-ring" viewBox="0 0 230 230" aria-hidden="true"><circle cx="115" cy="115" r="96" fill="${v.paper}" stroke="${v.gold}" stroke-width="1.6"/><circle cx="115" cy="115" r="89" fill="none" stroke="${v.line}"/>${ring(16,106,115,16)}</svg>

      ${divider}${whenC}${whereC}${progC}${divider}${galC}${rsvpC}${footer}`;
  }else if(lay==="editoryal"){
    page=`<section class="hero ed"><div class="ed-top"><span class="ed-vert">${EYEBROW[inv.lang][inv.type]}</span><div class="ed-main">
        ${cover?`<img class="ed-cover" src="${cover}" alt="">`:orn("ed-orn")}
        <div class="ed-rule"></div><h1 class="names ed-names">${namesH}</h1><div class="ed-rule"></div>${hostH}${leadH}</div></div></section>
      ${whenC}${whereC}${progC}${galC}${rsvpC}${footer}`;
  }else if(lay==="kartpostal"){
    page=`<div class="pc"><div class="pc-top">${cover?`<img class="pc-photo" src="${cover}" alt="">`:`<div class="pc-art">${orn()}</div>`}
        <div class="pc-stamp" aria-hidden="true"><div>${orn()}</div></div>
        <div class="pc-mark" aria-hidden="true"><span>${esc(dShort)}</span></div></div>

    const it=(c,cls="")=>`<div class="tl-it ${cls}"><span class="tl-dot" aria-hidden="true"></span>${c}</div>`;

        <div class="tk-perf" aria-hidden="true"><i></i></div>
        <div class="tk-stub"><div><small>${L.dateL}</small><b>${esc(dShort)}</b></div><div><small>${L.timeW}</small><b dir="ltr">${esc(inv.time||"—")}</b></div><div><small>${L.ticketNo}</small><b dir="ltr">${esc(inv.id.slice(0,4).toUpperCase())}</b></div></div></div>
        ${leadH}</section>
      ${divider}${whenC}${whereC}${progC}${divider}${galC}${rsvpC}${footer}`;
  }else{
    page=`<section class="hero${cover?" has-cv":""}">${wreath}${cover?`<div class="cv-frame"><img src="${cover}" alt=""></div>`:""}${eyebrow}<h1 class="names">${namesH}</h1>${hostH}${leadH}</section>
      ${divider}${whenC}${whereC}${progC}${divider}${galC}${rsvpC}${footer}`;
  }
  /* Açılış */
  const corner=`<svg class="corner" viewBox="0 0 200 200"><use href="#${o}" x="110" y="10" width="72" height="72"/><use href="#${o}" x="60" y="60" width="52" height="52"/><use href="#${o}" x="20" y="120" width="40" height="40"/></svg>`;
  const openers={
    env:`<div class="env op" data-gate><div class="box"><div class="back"></div><div class="letter">${orn()}</div><div class="front"></div><div class="flap"></div></div></div>`,
    door:`<div class="gate op" data-gate><div class="door l">${corner}<div class="panel t"></div><div class="panel b"></div><div class="handle"></div></div><div class="door r">${corner}<div class="panel t"></div><div class="panel b"></div><div class="handle"></div></div></div>`,
    perde:`<div class="perde op" data-gate><div class="cur l"></div><div class="cur r"></div><div class="val"></div></div>`,
    kitap:`<div class="book op" data-gate><div class="page"></div><div class="bcover"><div class="bframe">${orn("t")}${orn("b")}</div></div></div>`,
    muhur:`<div class="sealcover op" data-gate><i></i></div>`,
    isik:`<div class="light op" data-gate><div class="spot"></div></div>`
  };
  const disc=`<div class="seal-disc"><svg viewBox="0 0 180 180" aria-hidden="true">${ring(12,80,90,16)}</svg><span>${ini}</span></div>`;
  const sealH=opn==="muhur"
    ?`<div class="seal split" data-seal role="button" tabindex="0" aria-label="${L.tap}"><div class="seal-wrap"><div class="half l">${disc}</div><div class="half r">${disc}</div></div><div class="seal-hint">${L.tap}</div></div>`
    :`<div class="seal" data-seal role="button" tabindex="0" aria-label="${L.tap}">${disc}<div class="seal-hint">${L.tap}</div></div>`;
  const lbH=photos.length?`<div class="lb" data-lb hidden role="dialog" aria-modal="true" aria-label="${L.gallery}"><img alt=""><button type="button" class="lb-x" data-lbx aria-label="${L.close}"><svg><use href="#i-x"/></svg></button>${photos.length>1?`<button type="button" class="lb-p" data-lbp aria-label="${L.prev}"><svg><use href="#i-back"/></svg></button><button type="button" class="lb-n" data-lbn aria-label="${L.next}"><svg><use href="#i-back"/></svg></button>`:""}<div class="lb-c" data-lbc></div></div>`:"";
  host.innerHTML=`<div class="inv-host L-${lay}" dir="${inv.lang==="ar"?"rtl":"ltr"}" lang="${inv.lang}">
   <div class="inv-scroll"><div class="inv lay-${lay}">${page}</div></div>
   <div class="petals" data-petals></div>
   ${openers[opn]}
   ${sealH}
   ${lbH}
  </div>`;
  const root=host.querySelector(".inv-host");
  for(const k in v) root.style.setProperty("--"+k,v[k]);
  const scroller=root.querySelector(".inv-scroll"),gate=root.querySelector("[data-gate]"),seal=root.querySelector("[data-seal]");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const petals=n=>{const box=root.querySelector("[data-petals]");if(reduced)return;for(let i=0;i<n;i++){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");const z=14+Math.random()*24;s.setAttribute("viewBox","0 0 100 100");s.setAttribute("width",z);s.setAttribute("height",z);s.innerHTML=`<use href="#${th.fall}"/>`;s.style.left=Math.random()*100+"%";s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.setProperty("--rot",(Math.random()*720-360)+"deg");s.style.animationDuration=(4+Math.random()*4)+"s";s.style.animationDelay=Math.random()*1.6+"s";box.appendChild(s);setTimeout(()=>s.remove(),10000)}};
  let goneT=null;
  const open=()=>{if(root.classList.contains("opened"))return;root.classList.add("opened","revealed");gate.classList.add("open");petals(22);goneT=setTimeout(()=>gate.classList.add("gone"),reduced?500:OPEN_MS[opn])};
  seal.addEventListener("click",open);gate.addEventListener("click",open);
  seal.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  root.querySelector("[data-replay]").addEventListener("click",()=>{clearTimeout(goneT);scroller.scrollTop=0;gate.classList.remove("open","gone");root.classList.remove("opened","revealed")});
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{root:scroller,threshold:.12});
  root.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  /* Galeri büyük görünüm */
  const lb=root.querySelector("[data-lb]");
  if(lb){
    let gi=0,lastFocus=null;
    const show=i=>{gi=(i+photos.length)%photos.length;lb.querySelector("img").src=photos[gi];lb.querySelector("[data-lbc]").textContent=(gi+1)+" / "+photos.length};
    const close=()=>{lb.hidden=true;if(lastFocus)lastFocus.focus()};
    root.querySelectorAll("[data-gi]").forEach(b=>b.addEventListener("click",()=>{lastFocus=b;show(+b.dataset.gi);lb.hidden=false;lb.querySelector("[data-lbx]").focus()}));
    lb.querySelector("[data-lbx]").addEventListener("click",close);
    const pb=lb.querySelector("[data-lbp]"),nb=lb.querySelector("[data-lbn]");
    if(pb)pb.addEventListener("click",()=>show(gi-1));
    if(nb)nb.addEventListener("click",()=>show(gi+1));
    lb.addEventListener("click",e=>{if(e.target===lb)close()});
    lb.addEventListener("keydown",e=>{const rtl=root.dir==="rtl";if(e.key==="Escape")close();else if(e.key==="ArrowRight")show(gi+(rtl?-1:1));else if(e.key==="ArrowLeft")show(gi+(rtl?1:-1))});
  }
  if(p){
    const tick=()=>{let s=Math.max(0,Math.floor((p.local-Date.now())/1000));const vals=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];root.querySelectorAll("[data-cd]").forEach(b=>b.textContent=vals[b.dataset.cd])};
    tick();tickTimer=setInterval(tick,1000);
    const pad=n=>String(n).padStart(2,"0");
    const st=`${p.y}${pad(p.m)}${pad(p.d)}T${pad(p.hh)}${pad(p.mm)}00`;
    let en=st;if(inv.end){const [eh,em]=inv.end.split(":").map(Number);en=`${p.y}${pad(p.m)}${pad(p.d)}T${pad(eh)}${pad(em)}00`}else{const e2=new Date(p.local.getTime()+3*3600e3);en=`${e2.getFullYear()}${pad(e2.getMonth()+1)}${pad(e2.getDate())}T${pad(e2.getHours())}${pad(e2.getMinutes())}00`}
    const gq=new URLSearchParams({action:"TEMPLATE",text:EYEBROW[inv.lang][inv.type]+" · "+(couple?inv.n1+" & "+inv.n2:inv.n1),dates:st+"/"+en,location:[inv.venue,inv.address].filter(Boolean).join(", ")});
    const a=root.querySelector("[data-ics]");a.href="https://calendar.google.com/calendar/render?"+gq.toString();a.target="_blank";a.rel="noopener";
  }
  const form=root.querySelector("[data-rsvp]"),thanks=root.querySelector("[data-thanks]");
  form.addEventListener("change",()=>{const no=form.querySelector(`#n${inv.id}`).checked;form.querySelector("[data-countwrap]").style.display=no?"none":""});
  form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const name=form.querySelector('[data-r=name]').value.trim(),att=(form.querySelector("input[type=radio]:checked")||{}).value;
    form.querySelector('[data-e=name]').style.display=name.length<3?"block":"none";
    form.querySelector('[data-e=att]').style.display=!att?"block":"none";
    if(name.length<3||!att)return;
    const num=inv.wa.replace(/\D/g,"");
    if(num.length<10){const e=form.querySelector("[data-e=att]");e.textContent=L.noWa;e.style.display="block";return}
    const cnt=form.querySelector('[data-r=count]').value,msg=form.querySelector('[data-r=msg]').value.trim();
    let tx=`💐 ${couple?inv.n1+" & "+inv.n2:inv.n1} · ${EYEBROW[inv.lang][inv.type]}\n${L.rsvpHead}\n\n${L.waName}: ${name}\n${L.st}: ${att==="yes"?"✅ "+L.yes+"\n"+L.nPeople+": "+cnt:"❌ "+L.no}\n`;
    if(msg)tx+=`${L.mm}: ${msg}\n`;
    const waUrl="https://wa.me/"+num+"?text="+encodeURIComponent(tx);
    thanks.querySelector("[data-wa]").href=waUrl;
    thanks.querySelector("[data-tt]").textContent=att==="yes"?L.thxYes:L.thxNo;
    thanks.querySelector("[data-tx]").textContent=(att==="yes"?L.thxYesT:L.thxNoT).replace("{n}",name);
    form.style.display="none";thanks.style.display="block";if(att==="yes")petals(16);
    window.location.href=waUrl; /* aynı dokunuş içinde WhatsApp'ı aç (uygulama içinde dış uygulamaya yönlenir) */
  });
  thanks.querySelector("[data-editr]").addEventListener("click",()=>{form.style.display="";thanks.style.display="none"});
}

/* ===== Giriş noktaları ===== */
function notifyApp(msg){try{if(window.ZarflaApp&&window.ZarflaApp.postMessage)window.ZarflaApp.postMessage(msg)}catch(e){}}
function showMsg(text){const r=document.getElementById("root");r.innerHTML='<div class="zf-msg"></div>';r.firstChild.textContent=text}
window.renderInvite=function(data){
  try{
    const inv=typeof data==="string"?JSON.parse(data):Object.assign({},data);
    if(tickTimer){clearInterval(tickTimer);tickTimer=null}
    if(io){io.disconnect();io=null}
    normInv(inv);
    document.documentElement.lang=inv.lang;
    document.title=(EYEBROW[inv.lang]||EYEBROW.tr)[inv.type]+" · Zarfla";
    mountInvite(document.getElementById("root"),inv,true);
    notifyApp("rendered");
    return true;
  }catch(e){notifyApp("error:"+(e&&e.message||e));showMsg("Davetiye açılamadı · The invitation could not be opened");return false}
};
(function boot(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));
  const id=q.get("id")||h.get("id");
  if(id&&window.ZARFLA_DATA_URL){
    if(!/^[A-Za-z0-9_-]{4,64}$/.test(id)){showMsg("Davetiye bulunamadı · Invitation not found");return}
    fetch(window.ZARFLA_DATA_URL.replace("{id}",encodeURIComponent(id)),{cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(window.renderInvite)
      .catch(()=>showMsg("Davetiye bulunamadı · Invitation not found"));
  }
  notifyApp("ready");
})();
</script>
