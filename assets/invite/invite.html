<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zarfla</title>
<!--
  Zarfla davetli sayfası — TEK KAYNAK.
  Aynı dosya hem uygulama içi önizlemede (webview_flutter, assets/invite/invite.html)
  hem de davetli sayfasında (Firebase Hosting, https://zarfla-37da9.web.app/davetiye/; tools/build_hosting.py) kullanılır.
  Veri iki yolla gelir:
    1) window.renderInvite(veri)  — uygulama JSON nesnesini/dizesini doğrudan verir.
    2) ?id=XXXX (veya #id=XXXX)   — window.ZARFLA_DATA_URL ayarlıysa ("…/{id}.json"
       biçiminde), sayfa veriyi kendisi çeker (Aşama 2: Firebase/Firestore uç noktası).
  Reklam veya izleme kodu YOKTUR; eklemeyin.
  Kaynak: onaylı web önizlemesi (mountInvite, CSS, SVG semboller) birebir aktarıldı.
-->
<style>
/* Yazı tipleri: uygulamayla aynı paketli aileler (OFL; scripts/fetch_fonts.sh). Göreli yol ../fonts/ hem uygulama içi WebView'da
   (assets/invite/ → assets/fonts/) hem davetli sayfasında (Firebase Hosting: /davetiye/ → /fonts/, tools/build_hosting.py) çalışır. Dosya yoksa yedek zincir devreye girer. */
@font-face{font-family:"Fraunces";font-style:normal;font-weight:100 900;font-display:swap;src:url("../fonts/Fraunces.ttf") format("truetype")}
@font-face{font-family:"Fraunces";font-style:italic;font-weight:100 900;font-display:swap;src:url("../fonts/Fraunces-Italic.ttf") format("truetype")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url("../fonts/Manrope.ttf") format("truetype")}
@font-face{font-family:"Noto Naskh Arabic";font-style:normal;font-weight:400 700;font-display:swap;src:local("Noto Naskh Arabic"),url("../fonts/NotoNaskhArabic.ttf") format("truetype")}
:root{--zf-serif:"Fraunces","Noto Naskh Arabic","Amiri",Georgia,"Times New Roman",serif;--zf-sans:"Manrope","Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--zf-sans);background:#E4DBCB;color:var(--a-ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#root{position:fixed;inset:0}
.zf-msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:15px/1.5 var(--zf-sans);color:#5A5F58;background:#F7F1E8}
/* ===== DAVETİYE (davetlinin göreceği sayfa) ===== */
.inv-host{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.inv-scroll{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.inv{color:var(--ink);font-family:var(--zf-serif);max-width:560px;margin:0 auto;padding:0 18px 50px;opacity:0;transform:translateY(16px);transition:opacity 1.2s ease .8s,transform 1.2s ease .8s}
.inv-host.revealed .inv{opacity:1;transform:none}
.inv .hero{text-align:center;padding:56px 6px 22px}
.inv .guest-hi{position:relative;z-index:1;text-align:center;font-family:var(--zf-serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--accent);padding:30px 8px 0;margin-bottom:-30px;overflow-wrap:anywhere}
.inv .wreath{width:250px;max-width:78%;margin:0 auto 4px;display:block}
.inv .eyebrow{font-family:var(--zf-sans);letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:12px}
[dir=rtl] .inv .eyebrow,[dir=rtl] .inv .label{letter-spacing:0}
.inv .names{font-style:italic;font-weight:400;font-size:clamp(44px,13vw,70px);line-height:1.08;color:var(--accent)}
[dir=rtl] .inv .names{font-style:normal}
.inv .names .amp{display:block;font-size:.5em;color:var(--gold);margin:4px 0}
.inv .host{font-size:17px;color:var(--muted);margin-top:12px}
.inv .lead{font-size:20px;font-style:italic;color:var(--muted);margin-top:16px;line-height:1.55;white-space:pre-line}
[dir=rtl] .inv .lead{font-style:normal}
.inv .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px 0}
.inv .divider::before,.inv .divider::after{content:"";height:1px;width:70px;background:var(--line)}
.inv .divider svg{width:28px;height:28px}
.inv .icard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 22px;margin:18px 0;text-align:center;box-shadow:0 12px 30px -18px rgba(0,0,0,.35);position:relative;overflow:hidden}
.inv .icard .mini{position:absolute;width:64px;opacity:.9}
.inv .icard .mini.tl{top:-14px;inset-inline-start:-14px}
.inv .icard .mini.br{bottom:-14px;inset-inline-end:-14px}
.inv .label{font-family:var(--zf-sans);letter-spacing:.26em;text-transform:uppercase;font-size:11.5px;color:var(--accent);margin-bottom:10px;font-weight:600}
.inv .big{font-size:28px;font-weight:600;line-height:1.25}
.inv .sub{font-size:18px;color:var(--muted);margin-top:6px;line-height:1.45;white-space:pre-line}
.inv .daterow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.inv .daterow .side{font-family:var(--zf-sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 4px;min-width:86px}
.inv .daterow .day{font-size:56px;font-weight:600;color:var(--accent);line-height:1}
.inv .countdown{display:flex;justify-content:center;gap:8px;margin-top:20px}
.inv .countdown div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 0;width:64px}
.inv .countdown b{display:block;font-size:24px;font-weight:600;color:var(--accent)}
.inv .countdown small{font-family:var(--zf-sans);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.inv .ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--zf-sans);font-size:14px;font-weight:600;padding:13px 20px;border-radius:40px;border:none;cursor:pointer;text-decoration:none;min-height:46px}
.inv .ibtn-primary{background:var(--accent);color:var(--onAccent)}
.inv .ibtn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.inv .ibtn svg{width:18px;height:18px}
.inv .brow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.inv form{text-align:start;margin-top:14px}
.inv .ifield{margin-bottom:14px}
.inv .ifield label{display:block;font-family:var(--zf-sans);font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
/* Tasarım #19: RSVP alanları uygulamanın köşe jetonlarıyla (alan 10, seçim kartı 14). */
.inv{--zf-r-sm:10px;--zf-r-md:14px}
.inv .ifield input,.inv .ifield select,.inv .ifield textarea{width:100%;font-family:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--zf-r-sm);padding:12px 14px;outline:none;min-height:48px}
.inv .ifield textarea{min-height:70px;resize:vertical}
.inv .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv .choice input,.inv .ifield .choice input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0;padding:0}
.inv .choice label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:17px;color:var(--ink);border:1.5px solid var(--line);border-radius:var(--zf-r-md);padding:14px 8px;cursor:pointer;background:var(--bg);text-align:center;margin:0}
.inv .choice label svg{width:28px;height:28px}
.inv .choice input:checked+label{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inv .ierr{color:var(--err);font-family:var(--zf-sans);font-size:13px;margin:-6px 0 10px;display:none}
.inv .thanks{display:none;text-align:center;padding:8px 0}
.inv .thanks .wa-how{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--zf-sans);font-size:15px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px auto 0;max-width:420px}
.inv .thanks .wa-how svg{flex:0 0 auto;width:26px;height:26px;color:var(--accent)}
.rsvp-fab{position:absolute;inset-inline-start:14px;bottom:18px;z-index:40;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:999px;border:none;cursor:pointer;font-family:var(--zf-sans);font-size:15px;font-weight:600;background:var(--accent);color:var(--onAccent);box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
.rsvp-fab svg{width:18px;height:18px}
.opened .rsvp-fab.show{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion: reduce){.rsvp-fab{transition:none}}
.inv .thanks h3{font-style:italic;font-weight:400;font-size:40px;color:var(--accent)}
.inv .thanks p{font-size:18px;color:var(--muted);margin:8px 0 4px;line-height:1.5}
.inv footer{text-align:center;margin-top:36px}
.inv footer>svg{width:42px;height:42px;display:block;margin:0 auto 6px}
.lay-editoryal footer>svg{margin-inline-start:0}
.inv footer .sign{font-style:italic;font-size:32px;color:var(--accent)}
.inv footer p{font-size:16px;color:var(--muted);font-style:italic}
.inv .replay{margin-top:16px;background:none;border:none;font-family:var(--zf-sans);font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline}
.inv .madeby{margin-top:26px;font-family:var(--zf-sans);font-size:11.5px;color:var(--muted);opacity:.85}
.inv a.madeby{display:flex;width:fit-content;max-width:100%;box-sizing:border-box;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .35em;min-height:44px;padding:0 10px;margin:14px auto 0;text-decoration:none;color:var(--muted);-webkit-tap-highlight-color:transparent}
.inv a.madeby .mb-cta{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--line)}
.inv a.madeby:hover .mb-cta,.inv a.madeby:focus-visible .mb-cta{text-decoration-color:currentColor}
.inv a.madeby:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.lay-editoryal a.madeby{margin-inline-start:0;padding-inline-start:0}
.inv .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.inv .reveal.in{opacity:1;transform:none}
/* Kapı */
.gate{position:absolute;inset:0;z-index:50;perspective:1800px;display:flex;direction:ltr}
.gate.gone{pointer-events:none;visibility:hidden}
.door{position:relative;width:50%;height:100%;background:linear-gradient(180deg,var(--door1),var(--door2));transition:transform 2.2s cubic-bezier(.65,.02,.22,1),filter 2.2s ease;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
.door.l{transform-origin:left center;border-right:1px solid var(--doorLine)}
.door.r{transform-origin:right center;border-left:1px solid var(--doorLine)}
.gate.open .door.l{transform:rotateY(-108deg);filter:brightness(.7)}
.gate.open .door.r{transform:rotateY(108deg);filter:brightness(.7)}
.panel{position:absolute;left:12%;right:12%;border:2px solid var(--doorLine);border-radius:120px 120px 10px 10px}
.panel.t{top:7%;height:46%}.panel.b{bottom:7%;height:32%;border-radius:10px}
.panel::after{content:"";position:absolute;inset:10px;border:1px solid var(--doorLine);opacity:.6;border-radius:inherit}
.door svg.corner{position:absolute;width:46%}
.door.l svg.corner{top:-3%;left:-8%}
.door.r svg.corner{bottom:-3%;right:-8%;transform:rotate(180deg)}
.handle{position:absolute;top:50%;width:12px;height:70px;border-radius:8px;background:linear-gradient(180deg,#f7e2a1,#d6ad4c 50%,#b88a2c);transform:translateY(-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.door.l .handle{right:16px}.door.r .handle{left:16px}
/* Zarf */
.env{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s ease 1.5s;direction:ltr}
.env.open{opacity:0}
.env.gone{pointer-events:none;visibility:hidden}
.env .box{position:relative;width:300px;max-width:82%;aspect-ratio:3/2;perspective:900px;transition:transform 1s ease .9s}
.env.open .box{transform:translateY(40%) scale(.9)}
.env .back{position:absolute;inset:0;background:var(--door2);border-radius:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)}
.env .letter{position:absolute;left:7%;right:7%;top:10%;bottom:8%;background:var(--paper);border-radius:6px;transition:transform 1s ease .6s;display:grid;place-items:center}
.env .letter svg{width:46px;height:46px}
.env.open .letter{transform:translateY(-55%)}
.env .front{position:absolute;inset:0;background:linear-gradient(160deg,var(--door1),var(--door2));clip-path:polygon(0 30%,50% 65%,100% 30%,100% 100%,0 100%);border-radius:8px}
.env .flap{position:absolute;left:0;right:0;top:0;height:66%;background:var(--door1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .9s ease;z-index:3;filter:brightness(1.06)}
.env.open .flap{transform:rotateX(180deg);z-index:0}
/* Mühür */
.seal{position:absolute;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .6s ease,transform .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.85);pointer-events:none}
.seal-disc{width:140px;height:140px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.35),inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line);position:relative;animation:breathe 3s ease-in-out infinite}
.seal-disc svg{position:absolute;inset:-20px;width:180px;height:180px;animation:spin 40s linear infinite}
.seal-disc span{font-family:var(--zf-serif);font-style:italic;font-size:36px;color:var(--accent);position:relative;line-height:1;white-space:nowrap}
.seal-disc svg.ini-orn{position:static;inset:auto;width:52px;height:52px;animation:none;color:var(--accent)}
.mono-ini svg.ini-orn{width:84px;height:84px;color:var(--accent)}
.seal-hint{font-family:var(--zf-sans);font-weight:600;letter-spacing:.14em;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:9px 18px;border-radius:30px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}
.petals{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}/* metnin ALTINDA: yapraklar yazıyı örtmesin */
.petals svg{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
/* ===== Sayfa düzenleri ===== */
.inv .countdown div{flex:1 1 0;min-width:0;max-width:64px;width:auto}
.inv .countdown div,.inv .countdown b,.inv .countdown small{text-align:center!important}
.inv .countdown small{display:block}
.inv .daterow .side{min-width:0;flex:0 1 92px}
.inv img{display:block;max-width:100%}
.inv .hero.has-cv{padding-top:40px}.inv .has-cv .wreath{width:170px;margin-bottom:-4px}
.inv .cv-frame{width:230px;max-width:72%;margin:6px auto 18px;padding:7px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 30px -18px rgba(0,0,0,.45)}
.inv .cv-frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px}
.inv .prog{list-style:none;text-align:start;max-width:340px;margin:12px auto 0}
.inv .prog li{display:flex;gap:14px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.35}
.inv .prog li:last-child{border-bottom:none}
.inv .notes-card li{overflow-wrap:anywhere}
.notes-card .nt-ic{width:30px;height:30px;color:var(--accent);display:block;margin:0 auto 8px}
.inv .nt-list{list-style:none;text-align:center;max-width:340px;margin:10px auto 0}
.inv .nt-list li{padding:10px 2px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.45}
.inv .nt-list li:last-child{border-bottom:none}
.lay-editoryal .notes-card .nt-ic,.lay-zamancizelgesi .notes-card .nt-ic{margin-inline:0}
.lay-editoryal .nt-list,.lay-zamancizelgesi .nt-list{text-align:start;margin-inline-start:0}
.lay-kemer .notes-card .nt-ic{margin-bottom:6px}
.live-card .lv-ic,.gift-card .gf-ic{width:30px;height:30px;color:var(--accent);display:block;margin:0 auto 8px}
.lay-editoryal .live-card .lv-ic,.lay-editoryal .gift-card .gf-ic,.lay-zamancizelgesi .live-card .lv-ic,.lay-zamancizelgesi .gift-card .gf-ic{margin-inline:0}
.inv .gf-holder{font-size:22px;overflow-wrap:anywhere}
.inv .iban{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;letter-spacing:0;line-height:1.5;overflow-wrap:anywhere;margin:14px auto 4px;padding:11px 8px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);user-select:all;-webkit-user-select:all;max-width:340px}
.inv .gift-disc{font-size:13px;line-height:1.5;margin-top:14px;color:var(--muted)}
.zf-toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:90;max-width:86%;padding:10px 16px;border-radius:999px;background:rgba(20,20,22,.92);color:#fff;font-size:15px;line-height:1.35;text-align:center;transition:opacity .2s,transform .2s}
.zf-toast.on{opacity:1;transform:translate(-50%,0)}
.inv .prog b{color:var(--accent);flex:0 0 56px;font-variant-numeric:tabular-nums;font-weight:600;direction:ltr;text-align:start}
.inv .gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin-top:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.inv .gal-it{flex:0 0 72%;aspect-ratio:4/5;border:none;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;scroll-snap-align:center;background:var(--bg);box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
.inv .gal-it:only-child{flex-basis:100%}
.inv .gal-it img{width:100%;height:100%;object-fit:cover}
.lb{position:absolute;inset:0;z-index:80;background:rgba(8,8,10,.94);display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb button svg{width:22px;height:22px}
.lb .lb-x{top:14px;inset-inline-end:14px}
.lb .lb-p{inset-inline-start:10px;top:50%;margin-top:-24px}
.lb .lb-n{inset-inline-end:10px;top:50%;margin-top:-24px}
.lb .lb-n svg{transform:rotate(180deg)}
.inv-host[dir=rtl] .lb .lb-n svg{transform:none}
.inv-host[dir=rtl] .lb .lb-p svg{transform:rotate(180deg)}
.lb .lb-c{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-family:var(--zf-sans);font-size:14px;direction:ltr}
/* Kemer */
.hero-kemer{padding-top:40px!important}
.arch{width:280px;max-width:88%;margin:0 auto 6px;background:var(--paper);border:2px solid var(--gold);border-radius:150px 150px 18px 18px;padding:8px;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.arch-in{border:1px solid var(--line);border-radius:142px 142px 12px 12px;overflow:hidden;padding-bottom:20px}
.arch-img{width:100%;aspect-ratio:1/1.05;object-fit:cover}
.arch-orn{padding:38px 0 6px}.arch-orn svg{width:96px;height:96px;margin:0 auto;display:block}
.arch-txt{padding:16px 14px 0}
.arch .names{font-size:clamp(36px,10.5vw,52px)}
.lay-kemer .icard{border-radius:120px 120px 22px 22px;padding-top:40px}
.lay-kemer .icard .mini{display:none}
/* Monogram */
.hero-mono{padding-top:44px!important}
.mono{position:relative;width:230px;height:230px;margin:6px auto 18px;display:grid;place-items:center}
.mono-ring{position:absolute;inset:0;width:100%;height:100%}
.mono-img{width:152px;height:152px;border-radius:50%;object-fit:cover;position:relative;box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--line)}
.mono-ini{position:relative;font-style:italic;font-size:54px;color:var(--accent);line-height:1;white-space:nowrap}
[dir=rtl] .mono-ini{font-style:normal}
.inv .mono-names{font-size:clamp(26px,7.4vw,34px);font-style:normal;letter-spacing:.06em;color:var(--ink)}
[dir=rtl] .inv .mono-names{letter-spacing:0}
.inv .mono-names .amp{display:inline;font-size:.8em;margin:0 .2em;font-style:italic;color:var(--gold)}
.lay-monogram .icard{box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--line),0 12px 30px -18px rgba(0,0,0,.35)}
/* Editoryal */
.lay-editoryal{counter-reset:sec}
.ed{text-align:start!important;padding:46px 0 10px!important}
.ed-top{display:flex;gap:16px;align-items:stretch}
.ed-vert{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--zf-sans);font-size:11.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);border-inline-start:1px solid var(--line);padding-inline-start:8px;flex:none;white-space:nowrap}
[dir=rtl] .ed-vert{transform:none;letter-spacing:0;font-size:13px}
.ed-main{flex:1;min-width:0}
.ed-cover{width:84%;aspect-ratio:4/5;object-fit:cover;box-shadow:12px 12px 0 -1px var(--bg),12px 12px 0 0 var(--accent);margin-bottom:26px}
[dir=rtl] .ed-cover{box-shadow:-12px 12px 0 -1px var(--bg),-12px 12px 0 0 var(--accent)}
.ed-orn{width:84px;height:84px;margin-bottom:10px;display:block}
.ed-rule{height:1px;background:var(--accent);opacity:.7;margin:14px 0}
.inv .ed-names{font-style:normal;font-weight:400;font-size:clamp(46px,14vw,78px);line-height:.98;color:var(--ink);text-align:start;overflow-wrap:anywhere}
.inv .ed-names .amp{display:block;font-style:italic;font-size:.42em;color:var(--accent);margin:6px 0}
.ed .host,.ed .lead{text-align:start}
.lay-editoryal .icard{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;box-shadow:none;text-align:start;padding:24px 0 18px;margin:8px 0;overflow:visible}
.lay-editoryal .icard .mini{display:none}
.lay-editoryal .icard>.label{counter-increment:sec}
.lay-editoryal .icard>.label::before{content:counter(sec,decimal-leading-zero) "  ·  ";color:var(--muted)}
.lay-editoryal .brow,.lay-editoryal .daterow,.lay-editoryal .countdown{justify-content:flex-start}
.lay-editoryal .prog{margin-inline-start:0}
.lay-editoryal footer{text-align:start;border-top:1px solid var(--line);padding-top:22px}
/* Kartpostal */
.inv-host.L-kartpostal{background-color:var(--door2);background-image:radial-gradient(var(--doorLine) 1px,transparent 1.6px),linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.12));background-size:18px 18px,100% 100%}
.lay-kartpostal{padding:34px 16px 60px}
.pc{background:var(--paper);border-radius:6px;padding:14px 16px 26px;transform:rotate(-1.1deg);box-shadow:0 34px 50px -24px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.2)}
[dir=rtl] .pc{transform:rotate(1.1deg)}
.pc-top{position:relative;margin-bottom:6px}
.pc-photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px}
.pc-art{height:170px;border-radius:3px;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
.pc-art svg{width:110px;height:110px}
.pc-stamp{position:absolute;top:10px;inset-inline-end:10px;width:62px;height:74px;background:var(--paper);padding:5px;border:2px dashed var(--line);box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(4deg)}
.pc-stamp div{width:100%;height:100%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.pc-stamp svg{width:38px;height:38px}
.pc-mark{position:absolute;bottom:-22px;inset-inline-start:12px;width:84px;height:84px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;text-align:center;font-family:var(--zf-sans);font-size:11px;font-weight:700;line-height:1.25;color:var(--muted);background:var(--paper);transform:rotate(-12deg);padding:6px}
.lay-kartpostal .hero{padding:36px 4px 14px}
.pc-sheet{background:var(--paper);border-radius:6px;margin-top:30px;padding:6px 16px 26px;box-shadow:0 24px 40px -22px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.16);position:relative;overflow:hidden}
.pc-sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,var(--paper) 12px 18px,var(--gold) 18px 30px,var(--paper) 30px 36px)}
.pc-sheet>.icard:first-child{border-top:none;padding-top:30px}
.lay-kartpostal .icard{background:transparent;border:none;border-top:1.5px dashed var(--line);border-radius:0;box-shadow:none;margin:0;padding:24px 4px}
.lay-kartpostal .icard .mini{display:none}
.lay-kartpostal footer{border-top:1.5px dashed var(--line);padding-top:24px;margin-top:0}
/* Zaman çizelgesi */
.tl-cover{width:100%;margin:0 auto 20px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.tl-cover img{width:100%;aspect-ratio:16/11;object-fit:cover}
.tl{position:relative;padding-inline-start:30px;margin-top:8px}
.tl::before{content:"";position:absolute;inset-inline-start:9px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--accent),var(--line));border-radius:2px}
.tl-it{position:relative}
.tl-dot{position:absolute;inset-inline-start:-28px;top:34px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent);z-index:1}
.lay-zamancizelgesi .icard{text-align:start;padding:24px 18px}
.lay-zamancizelgesi .icard .mini{display:none}
.lay-zamancizelgesi .brow,.lay-zamancizelgesi .daterow,.lay-zamancizelgesi .countdown{justify-content:flex-start}
.tl-step{display:flex;gap:14px;align-items:baseline;padding:12px 4px}
.tl-step .tl-dot{top:16px;width:12px;height:12px;inset-inline-start:-25px;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--accent)}
.tl-step b{flex:0 0 58px;color:var(--accent);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.tl-step span{font-size:19px;line-height:1.35}
.tl-head{padding:16px 4px 2px}
.tl-head .tl-dot{display:none}
.tl-head .label{margin:0}
/* Bilet */
.tk{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;max-width:360px;margin:0 auto;box-shadow:0 18px 40px -24px rgba(0,0,0,.55)}
.tk-cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:17px 17px 0 0}
.tk-band{height:64px;border-radius:17px 17px 0 0;background:repeating-linear-gradient(135deg,var(--door1) 0 12px,var(--door2) 12px 24px);display:grid;place-items:center}
.tk-band svg{width:52px;height:52px;background:var(--paper);border-radius:50%;padding:6px}
.tk-main{padding:20px 18px 18px}
.tk .names{font-size:clamp(38px,11vw,56px)}
.tk-perf{position:relative;height:26px}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk-perf::before{left:-14px}.tk-perf::after{right:-14px}
.tk-perf i{position:absolute;left:20px;right:20px;top:12px;border-top:2px dashed var(--line)}
.tk-stub{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;padding:8px 14px 18px;font-family:var(--zf-sans);text-align:center}
.tk-stub small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
[dir=rtl] .tk-stub small{letter-spacing:0;font-size:12px}
.tk-stub b{font-size:15px;color:var(--ink);font-weight:700}
.tk-stub div+div{border-inline-start:1px dashed var(--line)}
.lay-bilet .icard{border-style:dashed;border-width:1.5px}
/* ===== Açılışlar ===== */
.perde{position:absolute;inset:0;z-index:50;overflow:hidden;transition:opacity .7s ease 1.4s}
.perde.open{opacity:0}.perde.gone{visibility:hidden;pointer-events:none}
.perde .cur{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,var(--door1) 0,var(--door2) 13px,var(--door1) 26px);transition:transform 1.6s cubic-bezier(.6,.02,.25,1);box-shadow:inset 0 -90px 90px -50px rgba(0,0,0,.35)}
.perde .cur.l{left:0;transform-origin:left top}.perde .cur.r{right:0;transform-origin:right top}
.perde.open .cur{transform:scaleX(.09)}
.perde .val{position:absolute;left:0;right:0;top:0;height:44px;background:var(--door2);border-bottom:2px solid var(--doorLine);box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:2}
.book{position:absolute;inset:0;z-index:50;perspective:2200px;transition:opacity .6s ease 1.6s}
.book.open{opacity:0}.book.gone{visibility:hidden;pointer-events:none}
.book .page{position:absolute;inset:0;background:var(--paper);background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px)}
.book .bcover{position:absolute;inset:0;background:linear-gradient(135deg,var(--door1),var(--door2));transform-origin:left center;transition:transform 1.6s cubic-bezier(.6,.02,.25,1),filter 1.6s ease;transform-style:preserve-3d}
.book .bcover::before{content:"";position:absolute;top:0;bottom:0;left:0;width:16px;background:rgba(0,0,0,.2)}
.inv-host[dir=rtl] .book .bcover{transform-origin:right center}
.inv-host[dir=rtl] .book .bcover::before{left:auto;right:0}
.book.open .bcover{transform:rotateY(-160deg);filter:brightness(.6)}
.inv-host[dir=rtl] .book.open .bcover{transform:rotateY(160deg)}
.book .bframe{position:absolute;inset:26px 22px 26px 34px;border:2px solid var(--doorLine);border-radius:10px}
.inv-host[dir=rtl] .book .bframe{inset:26px 34px 26px 22px}
.book .bframe::after{content:"";position:absolute;inset:8px;border:1px solid var(--doorLine);border-radius:6px;opacity:.7}
.book .bframe svg{position:absolute;width:54px;height:54px;left:50%;margin-left:-27px;opacity:.9}
.book .bframe svg.t{top:22px}.book .bframe svg.b{bottom:22px}
.sealcover{position:absolute;inset:0;z-index:50;background:var(--bg);transition:opacity .8s ease .9s}
.sealcover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1.3px,transparent 1.8px);background-size:22px 22px}
.sealcover i{position:absolute;inset:18px;border:1px solid var(--line);border-radius:16px}
.sealcover.open{opacity:0}.sealcover.gone{visibility:hidden;pointer-events:none}
.seal-wrap{position:relative;width:140px;height:140px}
.seal-wrap .half{position:absolute;inset:0;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .6s ease .55s}
.seal-wrap .half.l{clip-path:inset(-40px 50% -40px -40px)}
.seal-wrap .half.r{clip-path:inset(-40px -40px -40px 50%)}
.seal-wrap::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:1px;background:var(--line);transition:opacity .2s}
.seal-hint{transition:opacity .3s ease}
.opened .seal.split{opacity:1;transform:translate(-50%,-50%);transition:none}
.opened .seal.split .seal-hint,.opened .seal-wrap::after{opacity:0}
.opened .seal-wrap .half.l{transform:translateX(-120px) rotate(-22deg);opacity:0}
.opened .seal-wrap .half.r{transform:translateX(120px) rotate(22deg);opacity:0}
.light{position:absolute;inset:0;z-index:50;overflow:hidden;transition:opacity .8s ease 1.3s}
.light.open{opacity:0}.light.gone{visibility:hidden;pointer-events:none}
.light .spot{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;box-shadow:0 0 0 220vmax rgba(6,7,14,.96),inset 0 0 50px 8px var(--gold);transition:transform 1.8s cubic-bezier(.6,0,.3,1)}
.light .spot::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--gold);opacity:.6;animation:halo 2.4s ease-in-out infinite}
.light.open .spot{transform:scale(10)}
@keyframes halo{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.08);opacity:.25}}
/* --- Dalga 1 açılışları --- */
.ivy,.bloom,.ribbon,.flutter,.stars,.win{position:absolute;inset:0;z-index:50;overflow:hidden;direction:ltr}
.ivy.gone,.bloom.gone,.ribbon.gone,.flutter.gone,.stars.gone,.win.gone{visibility:hidden;pointer-events:none}
/* Sarmaşık */
.ivy{transition:opacity .6s ease 1.75s}.ivy.open{opacity:0}
.ivy .iv{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,var(--paper),var(--bg) 85%);transition:transform 1.75s cubic-bezier(.55,.02,.25,1);will-change:transform}
.ivy .iv.l{left:0;z-index:2;transform-origin:0 0;box-shadow:inset -26px 0 30px -28px rgba(0,0,0,.3)}
.ivy .iv.r{right:0;transform-origin:100% 0;transition-delay:.12s;box-shadow:inset 26px 0 30px -28px rgba(0,0,0,.3)}
.ivy .iv::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--accent);opacity:.55;border-bottom:1px solid var(--line)}
.ivy .iv svg{position:absolute;top:0;height:100%;width:116%;overflow:visible}
.ivy .iv.l svg{left:0}.ivy .iv.r svg{right:0;transform:scaleX(-1)}
.ivy .vn{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.ivy .ly use{fill:var(--leaf);--vein:var(--bg)}
.ivy .y0{opacity:.42}.ivy .y0 .vn{stroke-width:1.1}
.ivy .y1{opacity:.86}.ivy .y1 use{fill:var(--accent)}.ivy .y1 .vn{stroke-width:1.6;opacity:.75}
.ivy .y2 .vn{stroke-width:2.2;opacity:.85}
.ivy .ly use.bry{fill:var(--gold);stroke:var(--bg);stroke-width:.6}
.ivy .ly{transform-box:view-box;transform-origin:50% 0}
.ivy .y2{animation:ivsw 6s ease-in-out infinite alternate}
@keyframes ivsw{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.ivy .dr{transform-box:fill-box;transform-origin:50% 0}
.ivy.open .iv.l{transform:translateX(-106%) rotate(-3deg)}
.ivy.open .iv.r{transform:translateX(106%) rotate(3deg)}
.ivy.open .ly{animation:ivtr 1.6s cubic-bezier(.4,0,.3,1) both}
.ivy.open .y1{animation-delay:.08s}.ivy.open .y2{animation-delay:.16s}
@keyframes ivtr{0%{transform:none}30%{transform:translateX(9px) rotate(2.2deg)}62%{transform:translateX(-3px) rotate(-.9deg)}100%{transform:none}}
.ivy.open .dr{animation:ivdr 1.7s ease-in .1s both}.ivy.open .dr.d4{animation-delay:.35s}
@keyframes ivdr{to{transform:translate(26px,190px) rotate(80deg);opacity:0}}
/* Çiçek */
.bloom{transition:opacity .5s ease 1.4s}.bloom.open{opacity:0}
.bloom .bl-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--door1),var(--door2) 75%);transition:opacity .7s ease .25s}
.bloom.open .bl-bg{opacity:0}
.bloom .pt{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;transform:rotate(var(--r));border-radius:50% 50% 50% 50%/62% 62% 38% 38%;will-change:transform,opacity}
.bloom .pt.o{width:72%;height:66%;margin-left:-36%;background:linear-gradient(0deg,var(--door2),var(--door1) 62%,var(--paper));box-shadow:inset 0 0 0 1.5px var(--doorLine);transition:transform 1.5s cubic-bezier(.5,0,.3,1),opacity .9s ease .45s}
.bloom .pt.n{width:40%;height:34%;margin-left:-20%;background:linear-gradient(0deg,var(--gold),var(--paper));box-shadow:inset 0 0 0 1px var(--doorLine);transition:transform 1.1s cubic-bezier(.5,0,.3,1),opacity .7s ease .25s}
.bloom .bl-c{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--gold) 0 40%,var(--accent));transition:transform .7s ease,opacity .5s ease .2s}
.bloom.open .pt.o{transform:rotate(calc(var(--r) + 38deg)) translateY(-28%) scale(1.3);opacity:0}
.bloom.open .pt.n{transform:rotate(calc(var(--r) - 50deg)) scale(.15);opacity:0}
.bloom.open .bl-c{transform:translate(-50%,-50%) scale(0);opacity:0}
/* Kurdele */
.ribbon{perspective:1600px;transition:opacity .5s ease 2s}.ribbon.open{opacity:0}
.ribbon .wp{position:absolute;top:0;bottom:0;width:50%;background:radial-gradient(var(--doorLine) 1.4px,transparent 2px) 0 0/20px 20px,repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.07) 22px 34px),linear-gradient(135deg,var(--door1),var(--door2));transition:transform 1.3s cubic-bezier(.6,.02,.25,1) .9s}
.ribbon .wp.l{left:0;transform-origin:left center;box-shadow:inset -12px 0 24px -14px rgba(0,0,0,.4)}
.ribbon .wp.r{right:0;transform-origin:right center;box-shadow:inset 12px 0 24px -14px rgba(0,0,0,.4)}
.ribbon.open .wp.l{transform:rotateY(-100deg)}
.ribbon.open .wp.r{transform:rotateY(100deg)}
.ribbon .rbn{position:absolute;z-index:2;background-color:var(--gold);transition:transform .9s cubic-bezier(.6,0,.4,1) .35s}
.ribbon .rbn.h{top:50%;height:44px;margin-top:-22px;width:50%;background-image:linear-gradient(180deg,rgba(0,0,0,.22),transparent 28%,rgba(255,255,255,.34) 50%,transparent 72%,rgba(0,0,0,.22))}
.ribbon .rbn.h.l{left:0}.ribbon .rbn.h.r{right:0}
.ribbon .rbn.v{left:50%;width:44px;margin-left:-22px;height:50%;background-image:linear-gradient(90deg,rgba(0,0,0,.22),transparent 28%,rgba(255,255,255,.34) 50%,transparent 72%,rgba(0,0,0,.22))}
.ribbon .rbn.v.t{top:0}.ribbon .rbn.v.b{bottom:0}
.ribbon.open .rbn.h.l{transform:translateX(-105%)}.ribbon.open .rbn.h.r{transform:translateX(105%)}
.ribbon.open .rbn.v.t{transform:translateY(-105%)}.ribbon.open .rbn.v.b{transform:translateY(105%)}
.ribbon .bow{position:absolute;z-index:3;left:50%;top:50%;width:360px;max-width:96%;transform:translate(-50%,-43%);overflow:visible;transition:transform .7s ease .2s,opacity .5s ease .35s}
.ribbon .bow path,.ribbon .bow rect{fill:var(--gold)}
.ribbon .bow .fd{fill:none;stroke:rgba(0,0,0,.2);stroke-width:3;stroke-linecap:round}
.ribbon .bow .kn{stroke:rgba(0,0,0,.18);stroke-width:2}
.ribbon .bow .lp,.ribbon .bow .tl{transform-box:fill-box;transition:transform .55s cubic-bezier(.5,0,.6,1),opacity .4s ease .15s}
.ribbon .bow .lp.l{transform-origin:100% 50%}.ribbon .bow .lp.r{transform-origin:0 50%}
.ribbon .bow .tl{transform-origin:50% 0}
.ribbon.open .bow .lp.l{transform:rotate(-80deg) scale(.15);opacity:0}
.ribbon.open .bow .lp.r{transform:rotate(80deg) scale(.15);opacity:0}
.ribbon.open .bow .tl{transform:translateY(40%) scaleY(.2);opacity:0}
.ribbon.open .bow{transform:translate(-50%,-43%) scale(.4);opacity:0}
/* Kelebek */
.flutter{transition:opacity .5s ease 1.9s}.flutter.open{opacity:0}
.flutter::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--paper),var(--bg));transition:opacity 1s ease .5s}
.flutter.open::before{opacity:0}
.flutter i{position:absolute;width:var(--s);height:calc(var(--s)*.8);margin:calc(var(--s)*-.4) 0 0 calc(var(--s)*-.5);transform:rotate(var(--rot));transition:transform 1.6s cubic-bezier(.45,0,.75,.45) var(--d);will-change:transform}
.flutter i::before,.flutter i::after{content:"";position:absolute;top:0;width:50%;height:100%;-webkit-mask:var(--wm) center/100% 100% no-repeat;mask:var(--wm) center/100% 100% no-repeat}

.mn-date{font-family:var(--w3-sans);font-weight:500;font-size:13px;letter-spacing:.3em;color:var(--accent);margin-top:34px;unicode-bidi:isolate}
.mn-photo{margin:44px auto 0;width:78%}
.mn-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:saturate(.9)}
.lay-minimal .host{font-family:var(--w3-sans);font-size:14px;margin-top:40px;color:var(--muted)}
.lay-minimal .lead{font-family:var(--w3-serif);font-style:normal;font-size:18px;line-height:1.9;color:var(--ink);margin-top:20px}
.lay-minimal .divider{display:none}
.lay-minimal .icard{background:transparent;border:0;border-radius:0;box-shadow:none;padding:46px 0;margin:0;border-top:1px solid var(--line);overflow:visible}
.lay-minimal .icard .mini{display:none}
.lay-minimal .icard>.label{font-family:var(--w3-sans);font-weight:600;font-size:10.5px;letter-spacing:.42em;color:var(--muted);margin-bottom:18px}
[dir=rtl] .lay-minimal .icard>.label,[dir=rtl] .lay-minimal .eyebrow,[dir=rtl] .mn-date{letter-spacing:0;font-size:13px}
.lay-minimal .big{font-family:var(--w3-serif);font-weight:400;font-size:24px}
.lay-minimal .mn-cal+.icard .daterow{display:none}
.lay-minimal .countdown div{background:transparent;border:0;border-radius:0;padding:4px 0}
.lay-minimal .countdown div+div{border-inline-start:1px solid var(--line)}
.lay-minimal .countdown b{font-family:var(--w3-serif);font-weight:300;font-size:28px}
.lay-minimal .ibtn{border-radius:0;font-family:var(--w3-sans);letter-spacing:.06em}
.lay-minimal .ibtn-ghost{border-width:1px}
.mn-cal .mn-mon{font-family:var(--w3-serif);font-size:22px;color:var(--ink);margin-bottom:18px}
.mn-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;max-width:300px;margin:0 auto;font-family:var(--w3-sans);font-size:14px;color:var(--ink)}
.mn-grid small{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-bottom:8px;text-transform:uppercase}
.mn-grid span{line-height:34px;font-variant-numeric:tabular-nums}
.mn-grid span.we{color:var(--accent);opacity:.75}
.mn-grid span.on{position:relative;color:var(--onAccent);font-weight:700;opacity:1}
.mn-grid span.on::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);z-index:-1}
.mn-grid span.on{z-index:0}
.mn-dday{margin-top:18px;font-family:var(--w3-sans);font-size:12.5px;letter-spacing:.2em;color:var(--muted)}
.mn-dday b{color:var(--accent);font-weight:700}
.lay-minimal footer{margin-top:20px;border-top:1px solid var(--line);padding-top:46px}
.lay-minimal footer .sign{font-family:var(--w3-serif);font-style:normal;font-weight:300}
.lay-minimal footer>svg{display:none}

/* ---------- 5) GECE: koyu lüks + altın varak ışıltısı ---------- */
.inv-host.L-gece{background:radial-gradient(90% 60% at 50% 0,color-mix(in srgb,var(--door1) 30%,transparent),transparent 70%),var(--bg)}
.inv-host.L-gece.th-light{background:radial-gradient(90% 60% at 50% 0,color-mix(in srgb,var(--door1) 34%,transparent),transparent 70%),color-mix(in srgb,var(--door2) 20%,#0b0a0f)}
.L-gece .inv-scroll{background-image:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent) 0 .8px,transparent 1.3px),radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent) 0 .6px,transparent 1.1px);background-size:97px 89px,61px 67px;background-position:13px 7px,41px 33px;background-attachment:local}
.L-gece.th-light .inv-scroll{--lt-paper:var(--paper);--lt-gold:var(--gold);--lt-door:var(--door2);--lt-err:var(--err)}
.L-gece.th-light .inv{--bg:color-mix(in srgb,var(--lt-door) 24%,#0d0c11);--paper:color-mix(in srgb,var(--lt-door) 16%,#17161d);--ink:color-mix(in srgb,var(--lt-paper) 94%,#000);--muted:color-mix(in srgb,var(--lt-paper) 68%,#55505a);--gold:color-mix(in srgb,var(--lt-gold) 60%,#fff1cf);--accent:var(--gold);--onAccent:#15130f;--line:color-mix(in srgb,var(--gold) 30%,transparent);--ring:color-mix(in srgb,var(--gold) 28%,transparent);--err:#f0a590}
.lay-gece{--foil:linear-gradient(105deg,color-mix(in srgb,var(--gold) 82%,#000) 0%,var(--gold) 22%,color-mix(in srgb,var(--gold) 35%,#fff) 34%,var(--gold) 46%,color-mix(in srgb,var(--gold) 78%,#000) 62%,var(--gold) 80%,color-mix(in srgb,var(--gold) 45%,#fff) 92%,var(--gold) 100%)}
.lay-gece .gc{padding:40px 0 20px!important}
.gc-frame{position:relative;padding:44px 20px 38px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);outline:1px solid color-mix(in srgb,var(--gold) 22%,transparent);outline-offset:5px}
.gc-frame::before,.gc-frame::after{content:"";position:absolute;width:34px;height:34px;border:2px solid var(--gold);pointer-events:none}
.gc-frame::before{top:-9px;left:-9px;border-right:0;border-bottom:0}
.gc-frame::after{bottom:-9px;right:-9px;border-left:0;border-top:0}
.gc-orn{width:70px;height:70px;display:block;margin:0 auto 18px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--gold) 45%,transparent))}
.gc-photo{width:180px;max-width:62%;margin:0 auto 24px;padding:5px;border:1px solid var(--gold);border-radius:999px 999px 6px 6px}
.gc-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 3px 3px}
.lay-gece .eyebrow{color:var(--gold);letter-spacing:.4em;font-family:var(--w3-sans)}
.lay-gece .names{font-family:var(--w3-serif);font-style:normal;font-weight:400;font-size:clamp(42px,12.5vw,66px);background:var(--foil);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:gcfoil 7s ease-in-out infinite;padding:0 .05em}
.lay-gece .names .amp{font-style:italic;-webkit-text-fill-color:transparent}
@keyframes gcfoil{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.gc-rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px 0 14px}
.gc-rule i{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.gc-rule i:last-child{transform:scaleX(-1)}
.gc-rule svg{width:22px;height:22px}
.gc-date{font-family:var(--w3-sans);font-size:12px;font-weight:600;letter-spacing:.2em;line-height:1.7;text-transform:uppercase;color:var(--ink)}
[dir=rtl] .gc-date,[dir=rtl] .lay-gece .eyebrow{letter-spacing:0;font-size:14px}
.lay-gece .lead{color:var(--muted)}
.lay-gece .divider::before,.lay-gece .divider::after{background:linear-gradient(90deg,transparent,var(--gold))}
.lay-gece .divider::after{transform:scaleX(-1)}
.lay-gece .icard{background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 92%,transparent),color-mix(in srgb,var(--paper) 70%,transparent));border:1px solid var(--line);border-radius:4px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--paper) 0%,transparent),inset 0 0 0 5px color-mix(in srgb,var(--gold) 16%,transparent),0 20px 40px -26px rgba(0,0,0,.8)}
.lay-gece .icard .mini{display:none}
.lay-gece .icard>.label{color:var(--gold)}
.lay-gece .daterow .day,.lay-gece .countdown b{color:var(--gold)}
.lay-gece .countdown div{border-radius:2px}
.lay-gece .ibtn{border-radius:2px;letter-spacing:.04em}
.lay-gece footer .sign{font-family:var(--w3-serif);color:var(--gold)}

/* ---------- 6) HİKÂYE: Instagram hikâyesi gibi dikey ekranlar ---------- */
.L-hikaye .inv-scroll{container-type:size;scroll-snap-type:y proximity}
.lay-hikaye{padding:0 10px 30px}
.hk-bar{position:sticky;top:0;z-index:6;display:flex;gap:4px;padding:10px 6px 12px;margin:0 0 -26px;pointer-events:none}
.hk-bar i{flex:1;height:2.5px;border-radius:2px;background:color-mix(in srgb,var(--ink) 20%,transparent);overflow:hidden;box-shadow:0 0 3px rgba(0,0,0,.15)}
.hk-bar i b{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;transition:transform .45s ease}
[dir=rtl] .hk-bar i b{transform-origin:100% 50%}
.hk-bar i.on b{transform:none}
.hk-p{position:relative;min-height:600px;min-height:calc(100cqh - 20px);display:flex;flex-direction:column;justify-content:center;scroll-snap-align:start;margin:0 0 12px;padding:40px 18px 26px;border-radius:26px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.hk-p:nth-of-type(odd){background:linear-gradient(170deg,var(--paper),var(--bg))}
.hk-p:first-of-type{margin-top:10px}
.hk-p>.icard{background:transparent;border:0;box-shadow:none;margin:0;padding:10px 0;overflow:visible}
.hk-p>.icard .mini{display:none}
.hk-p>.icard>.label{font-size:12.5px;margin-bottom:16px}
.hk-p .big{font-size:32px}
.lay-hikaye .hk-hero{padding:0!important;flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
.hk-p.hk-first{padding:0;background:var(--paper)}
.hk-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hk-first.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 22%,transparent 48%,rgba(0,0,0,.72));pointer-events:none}
.hk-orn{position:absolute;left:50%;top:44%;width:62%;max-width:250px;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.9}
.hk-orn::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--leaf) 28%,transparent),transparent 68%)}
.hk-orn svg{position:relative;width:100%;height:100%}
.hk-head{position:absolute;top:30px;inset-inline-start:16px;inset-inline-end:16px;z-index:2;display:flex;align-items:center;gap:10px;text-align:start}
.hk-av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 0 0 2px var(--gold);font-family:var(--w3-serif);font-style:italic;font-size:14px;color:var(--accent);white-space:nowrap;overflow:hidden}
.hk-av svg.ini-orn{width:24px;height:24px;color:var(--accent)}
.hk-who{min-width:0;font-family:var(--w3-sans);line-height:1.25;color:var(--ink)}
.hk-who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk-who small{font-size:12px;opacity:.75}
.hk-txt{position:relative;z-index:2;padding:0 18px 70px}
.hk-txt .guest-hi{margin:0 0 10px;padding:0}
.lay-hikaye .hk-hero .names{font-family:var(--w3-serif);font-size:clamp(44px,13vw,68px)}
.hk-first.img .hk-who,.hk-first.img .names,.hk-first.img .eyebrow,.hk-first.img .guest-hi,.hk-first.img .hk-swipe{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hk-first.img .names .amp{color:color-mix(in srgb,var(--gold) 45%,#fff)}
.hk-swipe{position:absolute;z-index:2;left:50%;bottom:22px;width:26px;height:26px;margin-left:-13px;color:var(--accent);animation:hksw 1.8s ease-in-out infinite}
.hk-swipe svg{width:100%;height:100%}
@keyframes hksw{0%,100%{transform:none;opacity:.9}50%{transform:translateY(-7px);opacity:.45}}
.hk-quote{text-align:center}
.hk-quote .hk-q{width:46px;height:46px;display:block;margin:0 auto 18px}
.lay-hikaye .hk-quote .lead{font-family:var(--w3-serif);font-size:25px;line-height:1.5;color:var(--ink);margin-top:0}
.lay-hikaye .hk-quote .host{margin-top:22px;font-family:var(--w3-sans);font-size:14px;letter-spacing:.06em}
.lay-hikaye footer{margin-top:28px}

/* ===== Açılışlar · Dalga 3 ===== */
.zf2,.mk2,.ori,.dust,.tulip,.lan,.saray,.cfx{position:absolute;inset:0;z-index:50;overflow:hidden;direction:ltr}
.zf2.gone,.mk2.gone,.ori.gone,.dust.gone,.tulip.gone,.lan.gone,.saray.gone,.cfx.gone{visibility:hidden;pointer-events:none}
/* Kendi odak nesnesi olan açılışlarda yalnızca "dokunun" ipucu (disk yok) */
.seal.hint-only{top:auto;bottom:9%;transform:translate(-50%,0)}
.seal.hint-only .seal-disc{display:none}
.seal.hint-only .seal-hint{white-space:nowrap}
.opened .seal.hint-only{transform:translate(-50%,0) scale(.9)}
/* 1) Mektup zarfı (zarfacil) */
.zf2{background:radial-gradient(110% 70% at 50% 42%,var(--paper),var(--bg) 72%);transition:opacity .6s ease 1.8s;cursor:pointer}
.zf2.open{opacity:0}
.zf2 .z-st{position:absolute;left:50%;top:45%;width:316px;max-width:86%;aspect-ratio:7/5;transform:translate(-50%,-50%);perspective:1000px}
.zf2 .z-bk,.zf2 .z-fr,.zf2 .z-lt,.zf2 .z-fl{position:absolute;transition:transform .7s cubic-bezier(.5,0,.3,1) 1.25s,opacity .6s ease 1.3s}
.zf2 .z-bk{inset:0;border-radius:6px;background:linear-gradient(170deg,var(--door2),color-mix(in srgb,var(--door2) 80%,#000));box-shadow:0 24px 40px -18px rgba(0,0,0,.5);z-index:1}
.zf2 .z-lt{left:6%;right:6%;top:6%;height:88%;z-index:2;background:var(--paper);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8%;transition:transform .85s cubic-bezier(.4,0,.2,1) .5s,opacity .55s ease 1.6s}
.zf2 .z-lt::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);opacity:.55;border-radius:2px}
.zf2 .z-lt svg{width:30px;height:30px}
.zf2 .z-lt small{font-family:var(--w3-sans);font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.zf2 .z-lt b{font-family:var(--w3-serif);font-style:italic;font-weight:400;font-size:22px;color:var(--accent);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zf2 .z-fr{inset:0;z-index:3;border-radius:6px;background:linear-gradient(20deg,var(--door2),var(--door1) 75%);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.zf2 .z-fr::before,.zf2 .z-fr::after{content:"";position:absolute;inset:0}
.zf2 .z-fr::before{background:linear-gradient(60deg,rgba(0,0,0,.14),transparent 60%);clip-path:polygon(0 0,50% 54%,0 100%)}
.zf2 .z-fr::after{background:linear-gradient(-60deg,rgba(0,0,0,.08),transparent 60%);clip-path:polygon(100% 0,50% 54%,100% 100%)}
.zf2 .z-to{position:absolute;z-index:4;left:50%;bottom:11%;transform:translateX(-50%);max-width:70%;padding:6px 14px;background:var(--paper);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.22);font-family:var(--w3-serif);font-style:italic;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s ease 1.25s}
.zf2 .z-fl{left:0;right:0;top:0;height:60%;z-index:5;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.55,0,.35,1),opacity .6s ease 1.3s}
.zf2 .z-fl i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 6px 0 0}
.zf2 .z-fl .fo{background:linear-gradient(180deg,var(--door1),color-mix(in srgb,var(--door1) 78%,var(--door2)));box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.zf2 .z-fl .fi{transform:rotateX(180deg);background:radial-gradient(circle,var(--gold) 0 1.4px,transparent 1.9px) 0 0/13px 13px,radial-gradient(circle,color-mix(in srgb,var(--paper) 55%,transparent) 0 1px,transparent 1.5px) 6.5px 6.5px/13px 13px,linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.zf2 .z-wx{position:absolute;left:50%;top:100%;width:68px;height:68px;margin:-40px 0 0 -34px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px)}
.zf2 .z-wx span{font-size:19px}
.zf2.open .z-fl{transform:rotateX(180deg);z-index:1;transition:transform .8s cubic-bezier(.55,0,.35,1),z-index 0s linear .4s,opacity .6s ease 1.3s}
.zf2.open .z-lt{transform:translateY(-62%)}
.zf2.open .z-bk,.zf2.open .z-fr{transform:translateY(60px);opacity:0}
.zf2.open .z-fl{opacity:0}
.zf2.open .z-to{opacity:0}
.zf2 .z-wx{transition:opacity .15s linear .28s}.zf2.open .z-wx{opacity:0}
.zf2.open .z-lt{animation:zfLt 2.2s cubic-bezier(.4,0,.2,1) .5s both}
@keyframes zfLt{0%{transform:none}38%{transform:translateY(-62%)}60%{transform:translateY(-58%) scale(1.04);opacity:1}100%{transform:translateY(-34%) scale(1.5);opacity:0}}
/* 2) Mum mühür kırma (muhurkir) */
.mk2{transition:opacity .5s ease 1.7s;cursor:pointer}
.mk2.open{opacity:0}
.mk2 .mh{position:absolute;top:0;bottom:0;width:50.5%;background:radial-gradient(circle,color-mix(in srgb,var(--line) 55%,transparent) 0 .7px,transparent 1.2px) 0 0/9px 9px,linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--paper) 88%,var(--door2)));transition:transform 1.15s cubic-bezier(.6,.02,.3,1) .55s}
.mk2 .mh.l{left:0;box-shadow:inset -18px 0 26px -20px rgba(0,0,0,.35)}
.mk2 .mh.r{right:0;box-shadow:inset 18px 0 26px -20px rgba(0,0,0,.35)}
.mk2 .mh::before{content:"";position:absolute;top:22px;bottom:22px;border:1px solid var(--gold);opacity:.6}
.mk2 .mh.l::before{left:22px;right:0;border-right:0}
.mk2 .mh.r::before{right:22px;left:0;border-left:0}
.mk2 .mh::after{content:"";position:absolute;top:50%;height:16px;margin-top:-8px;width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#000),var(--accent) 40%,color-mix(in srgb,var(--accent) 75%,#000));opacity:.92}
.mk2.open .mh.l{transform:translateX(-104%) rotate(-2deg)}
.mk2.open .mh.r{transform:translateX(104%) rotate(2deg)}
.mk2 .ms{position:absolute;left:50%;top:50%;width:156px;height:156px;margin:-78px 0 0 -78px;z-index:2}
.mk2 .ms-sh{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.38),transparent 70%);transform:translateY(8px) scale(1.05);transition:opacity .3s ease .15s}
.mk2 .sd{position:absolute;inset:0;transition:transform .95s cubic-bezier(.2,.65,.35,1) .16s,opacity .6s ease .45s}
.mk2 .sd .w3-wax{position:absolute;inset:7%}
.mk2 .sd .w3-wax span{font-size:44px}
.mk2 .sd.a{clip-path:polygon(0 0,52% 0,55% 20%,47% 36%,51% 49%,34% 46%,20% 55%,0 48%)}
.mk2 .sd.b{clip-path:polygon(52% 0,100% 0,100% 50%,80% 45%,66% 52%,51% 49%,47% 36%,55% 20%)}
.mk2 .sd.c{clip-path:polygon(100% 50%,100% 100%,50% 100%,55% 82%,45% 64%,51% 49%,66% 52%,80% 45%)}
.mk2 .sd.d{clip-path:polygon(0 48%,20% 55%,34% 46%,51% 49%,45% 64%,55% 82%,50% 100%,0 100%)}
.mk2 .ck{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:color-mix(in srgb,var(--accent) 50%,#000);stroke-width:1.6;stroke-linejoin:round;opacity:0;transition:opacity .12s ease .02s}
.mk2.open .ck{opacity:1}
.mk2.open .ms-sh{opacity:0}
.mk2.open .sd{opacity:0}
.mk2.open .sd.a{transform:translate(-74px,-40px) rotate(-30deg)}
.mk2.open .sd.b{transform:translate(70px,-52px) rotate(26deg)}
.mk2.open .sd.c{transform:translate(58px,96px) rotate(34deg)}
.mk2.open .sd.d{transform:translate(-66px,90px) rotate(-24deg)}
.mk2.open .ck{transition:opacity .12s ease .02s;animation:mkck .5s ease .18s forwards}
@keyframes mkck{to{opacity:0}}
/* 3) Katlı kâğıt / origami (kagitkatla) */
.ori{perspective:1300px;transition:opacity .35s ease 1.65s;cursor:pointer}
.ori.open{opacity:0}
.ori .of{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.5,.05,.3,1),opacity .35s ease .85s;will-change:transform}
.ori .of::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),var(--g)}
.ori .of::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22))}
.ori .of.t{--g:linear-gradient(180deg,var(--door1),color-mix(in srgb,var(--door1) 60%,var(--door2)));transform-origin:50% 0;z-index:2}

  /* Katılım bildir: forma kaydır; yüzen düğme form görünene kadar durur */
  const rsvpSec=root.querySelector("[data-rsvpsec]"),fab=root.querySelector("[data-rsvpfab]");
  const toRsvp=()=>{if(!root.classList.contains("opened"))open();rsvpSec.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});const f=rsvpSec.querySelector("[data-r=name]");if(f)setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},reduced?0:450)};
  root.querySelectorAll("[data-rsvpjump],[data-rsvpfab]").forEach(b=>b.addEventListener("click",toRsvp));
  /* Yüzen düğme yalnız ne "Ne zaman" kartındaki düğme ne de form görünürken çıkar (aynı anda iki düğme olmasın) */
  const jump=root.querySelector("[data-rsvpjump]"),vis={sec:false,jump:false,below:true};
  if("IntersectionObserver" in window){const fo=new IntersectionObserver(es=>{es.forEach(e=>{if(e.target===rsvpSec){vis.sec=e.isIntersecting;vis.below=e.boundingClientRect.top>0}else vis.jump=e.isIntersecting});fab.classList.toggle("show",!vis.sec&&!vis.jump&&vis.below)},{root:scroller,threshold:0});fo.observe(rsvpSec);if(jump)fo.observe(jump)}
  seal.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  root.querySelector("[data-replay]").addEventListener("click",()=>{clearTimeout(goneT);scroller.scrollTop=0;gate.classList.remove("open","gone");root.classList.remove("opened","revealed")});
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{root:scroller,threshold:.12});
  /* Hikâye düzeni: üstteki ilerleme çubukları (Instagram hikâyesi gibi) */
  if(lay==="hikaye"&&"IntersectionObserver" in window){const pans=[...root.querySelectorAll(".hk-p")],segs=[...root.querySelectorAll(".hk-bar i")];
    const ho=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const k=pans.indexOf(e.target);segs.forEach((s,j)=>s.classList.toggle("on",j<=k))}}),{root:scroller,rootMargin:"-45% 0px -45% 0px",threshold:0});
    pans.forEach(x=>ho.observe(x));segs[0]&&segs[0].classList.add("on")}
  root.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  /* Galeri büyük görünüm */
  const lb=root.querySelector("[data-lb]");
  if(lb){
    let gi=0,lastFocus=null;
    const show=i=>{gi=(i+photos.length)%photos.length;lb.querySelector("img").src=photos[gi];lb.querySelector("[data-lbc]").textContent=(gi+1)+" / "+photos.length};
    const close=()=>{lb.hidden=true;if(lastFocus)lastFocus.focus()};
    root.querySelectorAll("[data-gi]").forEach(b=>b.addEventListener("click",()=>{lastFocus=b;show(+b.dataset.gi);lb.hidden=false;lb.querySelector("[data-lbx]").focus()}));
    lb.querySelector("[data-lbx]").addEventListener("click",close);
    const pb=lb.querySelector("[data-lbp]"),nb=lb.querySelector("[data-lbn]");
    if(pb)pb.addEventListener("click",()=>show(gi-1));
    if(nb)nb.addEventListener("click",()=>show(gi+1));
    lb.addEventListener("click",e=>{if(e.target===lb)close()});
    lb.addEventListener("keydown",e=>{const rtl=root.dir==="rtl";if(e.key==="Escape")close();else if(e.key==="ArrowRight")show(gi+(rtl?-1:1));else if(e.key==="ArrowLeft")show(gi+(rtl?1:-1))});
  }
  if(p){
    const tick=()=>{let s=Math.max(0,Math.floor((p.local-Date.now())/1000));const vals=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];root.querySelectorAll("[data-cd]").forEach(b=>b.textContent=vals[b.dataset.cd])};
    tick();tickTimer=setInterval(tick,1000);
    const pad=n=>String(n).padStart(2,"0");
    const st=`${p.y}${pad(p.m)}${pad(p.d)}T${pad(p.hh)}${pad(p.mm)}00`;
    let en=st;if(inv.end){const [eh,em]=inv.end.split(":").map(Number);en=`${p.y}${pad(p.m)}${pad(p.d)}T${pad(eh)}${pad(em)}00`}else{const e2=new Date(p.local.getTime()+3*3600e3);en=`${e2.getFullYear()}${pad(e2.getMonth()+1)}${pad(e2.getDate())}T${pad(e2.getHours())}${pad(e2.getMinutes())}00`}
    const gq=new URLSearchParams({action:"TEMPLATE",text:EYEBROW[inv.lang][inv.type]+" · "+(couple?inv.n1+" & "+inv.n2:inv.n1),dates:st+"/"+en,location:[inv.venue,inv.address].filter(Boolean).join(", ")});
    const a=root.querySelector("[data-ics]");a.href="https://calendar.google.com/calendar/render?"+gq.toString();a.target="_blank";a.rel="noopener";
  }
  /* Hediye IBAN: panoya kopyala (navigator.clipboard, olmazsa execCommand yedeği) */
  const toastEl=root.querySelector("[data-toast]");let toastT=null;
  const zfToast=m=>{toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("on"),2000)};
  root.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const txt=b.dataset.copy;
    const legacy=()=>{let ok=false;try{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";root.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand("copy");ta.remove()}catch(e){}return ok};
    const done=()=>zfToast(L.copied);
    const fail=()=>{const el=root.querySelector("[data-iban]");try{if(el){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}}catch(e){}zfToast(L.copyFail)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>legacy()?done():fail())}else{legacy()?done():fail()}
  }));
  const form=root.querySelector("[data-rsvp]"),thanks=root.querySelector("[data-thanks]");
  form.addEventListener("change",()=>{const no=form.querySelector(`#n${inv.id}`).checked;form.querySelector("[data-countwrap]").style.display=no?"none":""});
  form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const name=form.querySelector('[data-r=name]').value.trim(),att=(form.querySelector("input[type=radio]:checked")||{}).value;
    form.querySelector('[data-e=name]').style.display=name.length<3?"block":"none";
    form.querySelector('[data-e=att]').style.display=!att?"block":"none";
    if(name.length<3||!att)return;
    const num=inv.wa.replace(/\D/g,"");
    if(num.length<10){const e=form.querySelector("[data-e=att]");e.textContent=L.noWa;e.style.display="block";return}
    const cnt=form.querySelector('[data-r=count]').value,msg=form.querySelector('[data-r=msg]').value.trim();
    let tx=`💐 ${couple?inv.n1+" & "+inv.n2:inv.n1} · ${EYEBROW[inv.lang][inv.type]}\n${L.rsvpHead}\n\n${L.waName}: ${name}\n${L.st}: ${att==="yes"?"✅ "+L.yes+"\n"+L.nPeople+": "+cnt:"❌ "+L.no}\n`;
    if(msg)tx+=`${L.mm}: ${msg}\n`;
    const waUrl="https://wa.me/"+num+"?text="+encodeURIComponent(tx);
    thanks.querySelector("[data-wa]").href=waUrl;
    thanks.querySelector("[data-tt]").textContent=att==="yes"?L.thxYes:L.thxNo;
    thanks.querySelector("[data-tx]").textContent=(att==="yes"?L.thxYesT:L.thxNoT).replace("{n}",name);
    form.style.display="none";thanks.style.display="block";if(att==="yes")petals(16);
    window.location.href=waUrl; /* aynı dokunuş içinde WhatsApp'ı aç (uygulama içinde dış uygulamaya yönlenir) */
  });
  thanks.querySelector("[data-editr]").addEventListener("click",()=>{form.style.display="";thanks.style.display="none"});
}

/* ===== Giriş noktaları ===== */
function notifyApp(msg){try{if(window.ZarflaApp&&window.ZarflaApp.postMessage)window.ZarflaApp.postMessage(msg)}catch(e){}}
function showMsg(text){const r=document.getElementById("root");r.innerHTML='<div class="zf-msg"></div>';r.firstChild.textContent=text}
window.renderInvite=function(data){
  try{
    const inv=typeof data==="string"?JSON.parse(data):Object.assign({},data);
    if(tickTimer){clearInterval(tickTimer);tickTimer=null}
    if(io){io.disconnect();io=null}
    stopMusic();
    normInv(inv);
    document.documentElement.lang=inv.lang;
    document.title=(EYEBROW[inv.lang]||EYEBROW.tr)[inv.type]+" · Zarfla";
    mountInvite(document.getElementById("root"),inv,true);
    notifyApp("rendered");
    return true;
  }catch(e){notifyApp("error:"+(e&&e.message||e));showMsg("Davetiye açılamadı · The invitation could not be opened");return false}
};
(function boot(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));
  const id=q.get("id")||h.get("id");
  if(id&&window.ZARFLA_DATA_URL){
    if(!/^[A-Za-z0-9_-]{4,64}$/.test(id)){showMsg("Davetiye bulunamadı · Invitation not found");return}
    fetch(window.ZARFLA_DATA_URL.replace("{id}",encodeURIComponent(id)),{cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(d=>{if(d&&typeof d==="object")d.guest=guestFromUrl(location.search,location.hash);return window.renderInvite(d)})
      .catch(()=>showMsg("Davetiye bulunamadı · Invitation not found"));
  }
  notifyApp("ready");
})();
</script>
