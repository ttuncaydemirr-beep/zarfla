name: Sunucu yayını (Functions + kurallar + davetli sayfası)

# Yalnız elle: Actions → "Sunucu yayını (Functions + kurallar + davetli sayfası)" → Run workflow.
# "hosting": davetli sayfası + müzik + yazı tipleri → Firebase Hosting (https://zarfla-37da9.web.app).
#   Müzik/yazı tipleri stüdyo sitesi deposundaki lisanslı dosyalardan (fetch-music / fetch-fonts) alınır, sha256 doğrulanır.
# Gerekli secret: FIREBASE_DEPLOY_SA (yayıncı hizmet hesabının JSON anahtarının TAMAMI).
# Kurulum adımları: Aşama 3 faturalandırma kurulum belgesi (billing_setup.md).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Yayınlanacaklar (firebase deploy --only)"
        type: choice
        default: "functions,firestore:rules,storage"
        options:
          - "functions,firestore:rules,storage"
          - "functions"
          - "firestore:rules,storage"
          - "hosting"

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret denetimi
        env:
          SA: ${{ secrets.FIREBASE_DEPLOY_SA }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_DEPLOY_SA secret'ı yok. Depo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Fonksiyon paketleri ve testler
        if: inputs.only != 'hosting'
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run verify

      # ---- Davetli sayfası (yalnız only içinde hosting varsa) ----
      - name: Stüdyo sitesi (müzik ve yazı tipi kaynağı)
        if: contains(inputs.only, 'hosting')
        uses: actions/checkout@v4
        with:
          repository: ttuncaydemirr-beep/ttuncaydemirr-beep.github.io
          ref: main
          path: _site
          persist-credentials: false
          sparse-checkout: |
            src/music
            src/fonts

      - uses: actions/setup-python@v5
        if: contains(inputs.only, 'hosting')
        with:
          python-version: "3.12"

      - name: Davetli sayfasını üret (hosting/) ve denetle
        if: contains(inputs.only, 'hosting')
        run: |
          set -euo pipefail
          python3 tools/build_hosting.py --site _site
          node --test test/js/*.test.mjs
          python3 - <<'PY'
          import re
          h = open("hosting/davetiye/index.html", encoding="utf-8").read()
          s = re.findall(r"<script>(.*?)</script>", h, re.S)
          assert s, "betik yok"
          open("/tmp/inv.js", "w", encoding="utf-8").write("\n;\n".join(s))
          PY
          node --check /tmp/inv.js
          test "$(ls hosting/music/*.mp3 | wc -l)" -eq 16
          du -sh hosting

      - name: Kimlik dosyası
        env:
          SA: ${{ secrets.FIREBASE_DEPLOY_SA }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/deploy-sa.json"
          node -e "const j=require(process.argv[1]); if(j.type!=='service_account'||j.project_id!=='zarfla-37da9'){console.error('Secret zarfla-37da9 projesinin hizmet hesabı anahtarı değil'); process.exit(1)} console.log('Yayıncı: '+j.client_email)" "$RUNNER_TEMP/deploy-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/deploy-sa.json" >> "$GITHUB_ENV"

      # --force: etkileşimsiz modda Artifact Registry temizlik politikasını (eski kapsayıcı görüntüleri) onaylar.
      - name: Yayınla
        run: >
          npx -y firebase-tools@latest deploy
          --project zarfla-37da9
          --only "${{ inputs.only }}"
          --non-interactive --force

      - name: Hosting siteleri (tanı)
        if: always() && contains(inputs.only, 'hosting')
        run: npx -y firebase-tools@latest hosting:sites:list --project zarfla-37da9 || true

      - name: Davetli sayfası canlı denetim
        if: success() && contains(inputs.only, 'hosting')
        run: |
          set -euo pipefail
          B=https://zarfla-37da9.web.app
          chk() { # $1 yol, $2 beklenen başlık parçası
            local hdr; hdr=$(curl -fsSI --retry 5 --retry-delay 5 "$B$1")
            echo "$1 → $(echo "$hdr" | head -1)"
            echo "$hdr" | grep -qi "$2" || { echo "::error::$1: '$2' yok"; echo "$hdr"; exit 1; }
          }
          chk "/davetiye/?id=AbCdEf123456&g=Test" "x-robots-tag: noindex"
          chk "/davetiye/?id=AbCdEf123456" "content-security-policy:"
          chk "/music/dugun-wagner.mp3" "immutable"
          chk "/music/dugun-wagner.mp3" "content-type: audio/mpeg"
          chk "/fonts/Manrope.ttf" "immutable"
          chk "/" "content-type: text/html"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$B/yok-boyle-sayfa")
          test "$code" = "404" || { echo "::error::404 sayfası $code döndü"; exit 1; }
          curl -fsS "$B/davetiye/?id=AbCdEf123456" | grep -q 'ZARFLA_MUSIC_BASE' || { echo "::error::yükleyici yok"; exit 1; }

      - name: Fonksiyon listesi
        if: success() && contains(inputs.only, 'functions')
        run: npx -y firebase-tools@latest functions:list --project zarfla-37da9 || true

      - name: Kimlik dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-sa.json"
