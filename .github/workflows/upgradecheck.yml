name: Güncelleme yolu teşhisi (emülatör, Play Store imajı)
# Eski sürümü kur → kullan (monkey) → ara sürüme güncelle → yeni sürüme güncelle → aç; çökme/logcat topla.
# .github/upgradecheck_runs: 1. satır "eski run id'leri" (boşlukla, sırayla), 2. satır "yeni run id'leri" (boşlukla).
on:
  push:
    branches: [crashcheck]
    paths: ['.github/upgradecheck_runs']
permissions:
  actions: read
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      olds: ${{ steps.p.outputs.olds }}
      news: ${{ steps.p.outputs.news }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          olds=$(sed -n 1p .github/upgradecheck_runs)
          news=$(sed -n 2p .github/upgradecheck_runs | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -cs .)
          echo "olds=$olds" >> $GITHUB_OUTPUT
          echo "news=$news" >> $GITHUB_OUTPUT
  emu:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        new: ${{ fromJson(needs.plan.outputs.news) }}
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/checkout@v4
      - name: "AAB'leri indir ve evrensel APK üret (aynı imza, güncelleme mümkün)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLDS: ${{ needs.plan.outputs.olds }}
          NEW: ${{ matrix.new }}
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias dbg -dname "CN=dbg" -keyalg RSA -validity 1000
          i=0
          for r in $OLDS $NEW; do
            i=$((i+1))
            mkdir -p d$i
            gh run download $r -R ${{ github.repository }} -n zarfla-release-aab-signed -D d$i
            java -jar bundletool.jar build-apks --bundle=$(ls d$i/*.aab | head -1) --output=a$i.apks --mode=universal --ks=dbg.jks --ks-pass=pass:android --ks-key-alias=dbg --key-pass=pass:android
            unzip -o -q a$i.apks universal.apk && mv universal.apk app$i.apk
            echo "app$i.apk <- run $r"
          done
          echo "N=$i" >> $GITHUB_ENV
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emülatörde güncelleme yolu
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          disable-animations: true
          script: bash .github/upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "upgrade-logcat-${{ matrix.new }}", path: "logcat*.txt\nshot_*.png" }
