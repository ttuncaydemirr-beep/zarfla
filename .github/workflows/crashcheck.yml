name: Çökme teşhisi (emülatör)
on:
  push:
    branches: [crashcheck]
    paths: ['.github/crashcheck_run_id']
permissions:
  actions: read
  contents: read
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "id=$(head -1 .github/crashcheck_run_id)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: zarfla-release-aab-signed
          path: dist
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Evrensel APK üret
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias dbg -dname "CN=dbg" -keyalg RSA -validity 1000
          ls -la dist
          java -jar bundletool.jar build-apks --bundle=$(ls dist/*.aab | head -1) --output=app.apks --mode=universal --ks=dbg.jks --ks-pass=pass:android --ks-key-alias=dbg --key-pass=pass:android
          unzip -o app.apks universal.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç ve logcat topla
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r universal.apk
            adb logcat -c
            adb shell monkey -p com.demirgamesstudio.zarfla -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > shot_home.png || true
            adb shell input tap 540 2100 || true
            sleep 4
            adb exec-out screencap -p > shot_tap.png || true
            adb shell pidof com.demirgamesstudio.zarfla || echo "UYGULAMA ÇALIŞMIYOR (çöktü)"
            adb logcat -d > logcat.txt || true
            grep -E " (E|W) flutter|E/flutter|Unhandled Exception" logcat.txt | head -60 || true
            for f in shot_home.png shot_tap.png; do echo "=====B64 $f"; base64 -w0 $f; echo; echo "=====END"; done
            grep -n -A40 "FATAL EXCEPTION\|AndroidRuntime\|Fatal signal" logcat.txt | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logcat, path: "logcat.txt\nshot_*.png" }
