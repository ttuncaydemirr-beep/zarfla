name: Derleme

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play:
        description: "Google Play kapalı teste (alpha) yükle"
        type: boolean
        default: false
      track:
        description: "Play kanalı (internal = dahili test, alpha = kapalı test: Google TEST reklamı; production = GERÇEK reklam birimi)"
        type: choice
        options: [internal, alpha, production]
        default: alpha
      play_check:
        description: "Yalnızca Play API erişimini sına (yükleme yapmaz)"
        type: boolean
        default: false

# En az yetki (güvenlik denetimi O-3): GITHUB_TOKEN yalnız depoyu okur. Artifact/önbellek ayrı jetonla çalışır.
permissions:
  contents: read

# Aynı dalda yeni push gelince eski çalışma iptal edilir (Actions bütçesi: aylık 10 $).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter sürümü
        run: flutter --version

      - name: Yazı tiplerini indir
        run: bash scripts/fetch_fonts.sh

      - name: Android projesini hazırla
        run: bash scripts/prepare_android.sh

      - name: Paketler
        run: flutter pub get

      - name: Çözülen Firebase ve faturalandırma sürümleri
        run: |
          grep -A8 -E '^  (firebase_core|firebase_auth|cloud_firestore|firebase_storage|cloud_functions|firebase_app_check|in_app_purchase|in_app_purchase_android):' pubspec.lock || true
          echo "---- in_app_purchase (pub deps) ----"
          flutter pub deps --style=compact | grep -E 'in_app_purchase' || true
          echo "---- Play Billing Library (in_app_purchase_android/android) ----"
          grep -rhoE "com\.android\.billingclient:billing[^'\"]*" "${PUB_CACHE:-$HOME/.pub-cache}"/hosted/pub.dev/in_app_purchase_android-*/android/ 2>/dev/null | sort -u || true

      - name: Analiz (uyarılar geçer, hatalar durdurur)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test

      - name: Debug APK
        run: flutter build apk --debug --build-name=1.0.$((GITHUB_RUN_NUMBER + 100)) --build-number=$((GITHUB_RUN_NUMBER + 100)) --dart-define=ZARFLA_BUILD=$((GITHUB_RUN_NUMBER + 100))

      - name: İmza anahtarı (secret varsa)
        id: signing
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::warning::SIGNING_PASSPHRASE secret'ı yok (fork?). Release AAB debug imzayla derlenecek; Play'e yüklenemez."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$SIGNING_PASSPHRASE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/upload.jks.enc -out android/app/upload.jks \
            -pass env:SIGNING_PASSPHRASE
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$SIGNING_PASSPHRASE"
            echo "keyAlias=zarfla"
            echo "keyPassword=$SIGNING_PASSPHRASE"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Yükleme anahtarı çözüldü."

      # versionCode = çalışma no + 100 (her derlemede artar); versionName = "1.0.<versionCode>" (Play'de ve uygulamanın
      # Hakkında ekranında hangi derlemenin yüklü olduğu görünsün). ZARFLA_BUILD aynı kodu Dart tarafına verir.
      # R8 küçültme + gizleme açık (patch_android.py: isMinifyEnabled/isShrinkResources, proguard-rules.pro).
      # Dart gizleme: --obfuscate + --split-debug-info (semboller artifact olarak saklanır, çökme izi için gerekir).
      # Reklam (denetim N-6): internal/alpha (ve kanalı bilinmeyen push) derlemeleri Google TEST banner birimiyle yapılır
      # (--dart-define=ZARFLA_TEST_ADS=true): testçiler gerçek reklama dokunup AdMob hesabını riske atmasın.
      # Gerçek reklam birimi YALNIZ track=production seçilen elle çalıştırmada derlenir. Varsayılan kanal alpha → test reklamı.
      - name: Release AAB
        env:
          TRACK: ${{ inputs.track }}
        run: |
          TEST_ADS_FLAG=""
          if [ "$TRACK" != "production" ]; then
            TEST_ADS_FLAG="--dart-define=ZARFLA_TEST_ADS=true"
            echo "::notice::Test reklamı AÇIK (kanal: ${TRACK:-bilinmiyor}). Gerçek reklam için track=production seçin."
          else
            echo "::warning::PRODUCTION derlemesi: GERÇEK AdMob birimi kullanılır."
          fi
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --build-name=1.0.$((GITHUB_RUN_NUMBER + 100)) --build-number=$((GITHUB_RUN_NUMBER + 100)) --dart-define=ZARFLA_BUILD=$((GITHUB_RUN_NUMBER + 100)) $TEST_ADS_FLAG

      # Tehlikeli yön: production DIŞI derlemede gerçek reklam birimi AAB'de bulunmamalı (bulunursa durur).
      # Production derlemede bulunmaması yalnız uyarıdır (dizge yakalanamamış olabilir).
      - name: Reklam birimi denetimi
        env:
          TRACK: ${{ inputs.track }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          REAL='ca-app-pub-3269207938446570/5079566629'
          n=$(unzip -p "$AAB" 'base/lib/*/libapp.so' 2>/dev/null | grep -a -c "$REAL" || true)
          if [ "$TRACK" != "production" ]; then
            if [ "${n:-0}" -gt 0 ]; then echo "::error::Test reklamı derlemesinde GERÇEK reklam birimi bulundu"; exit 1; fi
            echo "Reklam: test birimi (gerçek birim AAB'de yok)."
          else
            if [ "${n:-0}" -eq 0 ]; then echo "::warning::Production derlemesinde gerçek reklam birimi dizgesi bulunamadı (kontrol edin)"; else echo "Reklam: gerçek birim var (production)."; fi
          fi

      - name: İmzayı doğrula
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "versionCode: $((GITHUB_RUN_NUMBER + 100))  versionName: 1.0.$((GITHUB_RUN_NUMBER + 100))"
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          grep -E 'SHA1:|SHA256:' /tmp/cert.txt || true
          jarsigner -verify "$AAB" | head -3
          if [ "$SIGNED" = "true" ]; then
            grep -q 'CN=Demir Games Studio' /tmp/cert.txt || { echo "::error::AAB sahibi CN=Demir Games Studio değil"; exit 1; }
            echo "İmza doğrulandı: CN=Demir Games Studio"
          else
            echo "::warning::İmzasız/debug imzalı derleme; sahip doğrulaması atlandı."
          fi

      - name: Anahtar dosyalarını sil
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: R8 mapping dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-r8-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Dart sembollerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-dart-symbols
          path: build/symbols
          if-no-files-found: warn
          retention-days: 90

      - name: İmzalı AAB'yi yükle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-release-aab-signed
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Debug imzalı AAB'yi yükle (secret yok)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-release-aab-debugsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Güvenlik kuralları: Firebase emülatöründe firestore.rules + storage.rules testleri (rules-test/).
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test paketleri
        working-directory: rules-test
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Kural testleri (emülatör)
        run: >
          npx -y firebase-tools@15.37 emulators:exec --project demo-zarfla --only firestore,storage
          "node --test --test-reporter=spec rules-test/rules.test.mjs"

  # Cloud Functions (functions/): sözdizimi denetimi, sahte Google Play API ile birim testleri,
  # gerçek bağımlılıklarla index.js'nin yüklenmesi. Yayın (deploy) ayrı ve elle: deploy-functions.yml.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Paketler
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Çözülen sürümler
        working-directory: functions
        run: npm ls firebase-functions firebase-admin googleapis --depth=0 || true

      - name: Denetim + birim testleri + yükleme
        working-directory: functions
        run: npm run verify

      - name: Davetli sayfası (invite.html) JS testleri
        run: node --test test/js/*.test.mjs

      - name: Davetli sayfası CSP özeti firebase.json ile aynı mı
        run: python3 tools/build_hosting.py --check-csp

  # Google Play kapalı test (alpha) yüklemesi: yalnızca elle başlatılan çalışmada, play=true ise.
  # PLAY_SERVICE_ACCOUNT_JSON secret'ı (play-yukleyici hizmet hesabı) gerekir.
  play:
    needs: [build, rules, functions]
    if: github.event_name == 'workflow_dispatch' && inputs.play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zarfla-release-aab-signed
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: zarfla-r8-mapping
          path: dist-mapping
      - name: Play'e yükle (alpha)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.demirgamesstudio.zarfla
          releaseFiles: dist/app-release.aab
          mappingFile: dist-mapping/mapping.txt
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

  # Play API erişim sınaması: düzenleme açar, kanalları okur, düzenlemeyi siler (hiçbir şey yayınlamaz).
  play-check:
    if: github.event_name == 'workflow_dispatch' && inputs.play_check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Play API erişimini sına
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret'ı yok"; exit 1; fi
          pip install -q google-api-python-client google-auth
          python3 - <<'PY'
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          info = json.loads(os.environ["SA"])
          print("Hizmet hesabı:", info.get("client_email"))
          cr = service_account.Credentials.from_service_account_info(info, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          ap = build("androidpublisher", "v3", credentials=cr, cache_discovery=False)
          pkg = "com.demirgamesstudio.zarfla"
          e = ap.edits().insert(packageName=pkg, body={}).execute()
          for t in ap.edits().tracks().list(packageName=pkg, editId=e["id"]).execute().get("tracks", []):
              print("Kanal:", t["track"], [(r.get("status"), r.get("versionCodes")) for r in t.get("releases", [])])
          ap.edits().delete(packageName=pkg, editId=e["id"]).execute()
          print("Play API erişimi TAMAM")
          PY
