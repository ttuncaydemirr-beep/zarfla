name: Derleme

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı dalda yeni push gelince eski çalışma iptal edilir (Actions bütçesi: aylık 10 $).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter sürümü
        run: flutter --version

      - name: Yazı tiplerini indir
        run: bash scripts/fetch_fonts.sh

      - name: Android projesini hazırla
        run: bash scripts/prepare_android.sh

      - name: Paketler
        run: flutter pub get

      - name: Analiz (uyarılar geçer, hatalar durdurur)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test

      - name: Debug APK
        run: flutter build apk --debug

      - name: Release AAB (şimdilik debug imzalı; gerçek imza Aşama 3)
        run: flutter build appbundle --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
