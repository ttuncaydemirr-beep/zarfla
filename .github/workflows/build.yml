name: Derleme

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play:
        description: "Google Play kapalı teste (alpha) yükle"
        type: boolean
        default: false

# Aynı dalda yeni push gelince eski çalışma iptal edilir (Actions bütçesi: aylık 10 $).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter sürümü
        run: flutter --version

      - name: Yazı tiplerini indir
        run: bash scripts/fetch_fonts.sh

      - name: Android projesini hazırla
        run: bash scripts/prepare_android.sh

      - name: Paketler
        run: flutter pub get

      - name: Çözülen Firebase ve faturalandırma sürümleri
        run: grep -A6 -E '^  (firebase_core|firebase_auth|cloud_firestore|firebase_storage|cloud_functions|in_app_purchase|in_app_purchase_android):' pubspec.lock || true

      - name: Analiz (uyarılar geçer, hatalar durdurur)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test

      - name: Debug APK
        run: flutter build apk --debug

      - name: İmza anahtarı (secret varsa)
        id: signing
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::warning::SIGNING_PASSPHRASE secret'ı yok (fork?). Release AAB debug imzayla derlenecek; Play'e yüklenemez."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$SIGNING_PASSPHRASE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/upload.jks.enc -out android/app/upload.jks \
            -pass env:SIGNING_PASSPHRASE
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$SIGNING_PASSPHRASE"
            echo "keyAlias=zarfla"
            echo "keyPassword=$SIGNING_PASSPHRASE"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Yükleme anahtarı çözüldü."

      # versionName 1.0.0 (pubspec), versionCode = çalışma no + 100 (her derlemede artar).
      # --no-shrink: R8/küçültme kapalı. Firebase/Flutter için keep kuralı yazmak yerine güvenli yol
      # seçildi; kapalıyken yansıma/serileştirme kaynaklı çalışma zamanı çökmesi riski yok.
      - name: Release AAB
        run: flutter build appbundle --release --no-shrink --build-name=1.0.0 --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: İmzayı doğrula
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "versionCode: $((GITHUB_RUN_NUMBER + 100))"
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          grep -E 'SHA1:|SHA256:' /tmp/cert.txt || true
          jarsigner -verify "$AAB" | head -3
          if [ "$SIGNED" = "true" ]; then
            grep -q 'CN=Demir Games Studio' /tmp/cert.txt || { echo "::error::AAB sahibi CN=Demir Games Studio değil"; exit 1; }
            echo "İmza doğrulandı: CN=Demir Games Studio"
          else
            echo "::warning::İmzasız/debug imzalı derleme; sahip doğrulaması atlandı."
          fi

      - name: Anahtar dosyalarını sil
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: İmzalı AAB'yi yükle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-release-aab-signed
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Debug imzalı AAB'yi yükle (secret yok)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarfla-release-aab-debugsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Güvenlik kuralları: Firebase emülatöründe firestore.rules + storage.rules testleri (rules-test/).
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test paketleri
        working-directory: rules-test
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Kural testleri (emülatör)
        run: >
          npx -y firebase-tools@latest emulators:exec --project demo-zarfla --only firestore,storage
          "node --test --test-reporter=spec rules-test/rules.test.mjs"

  # Cloud Functions (functions/): sözdizimi denetimi, sahte Google Play API ile birim testleri,
  # gerçek bağımlılıklarla index.js'nin yüklenmesi. Yayın (deploy) ayrı ve elle: deploy-functions.yml.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Paketler
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Çözülen sürümler
        working-directory: functions
        run: npm ls firebase-functions firebase-admin googleapis --depth=0 || true

      - name: Denetim + birim testleri + yükleme
        working-directory: functions
        run: npm run verify

  # Google Play kapalı test (alpha) yüklemesi: yalnızca elle başlatılan çalışmada, play=true ise.
  # PLAY_SERVICE_ACCOUNT_JSON secret'ı (play-yukleyici hizmet hesabı) gerekir.
  play:
    needs: [build, rules, functions]
    if: github.event_name == 'workflow_dispatch' && inputs.play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zarfla-release-aab-signed
          path: dist
      - name: Play'e yükle (alpha)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.demirgamesstudio.zarfla
          releaseFiles: dist/app-release.aab
          track: alpha
          status: completed
          whatsNewDirectory: distribution/whatsnew
